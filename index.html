<!DOCTYPE html>
<html lang="pt-BR" data-tema="claro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Elo IMOB</title>
<meta name="theme-color" content="#F2F4F8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Elo IMOB">
<link rel="icon" href="logoelo.png">
<link rel="apple-touch-icon" href="logoelo.png">
<style>
/* =====================================================================
   ELO IMOB — mesmos tokens do Elo Compras (padrão SafeDose).
   ===================================================================== */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&display=swap');

:root{
  --sd-bg:#F2F4F8; --sd-surface:#FFFFFF; --sd-surface2:#F7F9FC; --sd-surface3:#EEF2FA;
  --sd-border:#E9EEF6; --sd-border-strong:#D8E0EE;
  --sd-text:#0B1524; --sd-muted:#5A6B85; --sd-faint:#93A0B5;
  --sd-primary:#1B4DE4; --sd-primary-hover:#1740C4; --sd-primary-soft:#EAF0FE; --sd-on-primary:#FFFFFF;
  --sd-success:#0FA968; --sd-success-soft:#E4F7EE;
  --sd-danger:#E23B3B;  --sd-danger-soft:#FCE7E7;
  --sd-warning:#E08A00; --sd-warning-soft:#FCEFD6;
  --sd-cyan:#0E7A93;    --sd-cyan-soft:#E0F2F7;
  --sd-sh-sm:0 2px 8px rgba(16,28,54,.06);
  --sd-sh-md:0 6px 22px rgba(16,28,54,.08);
  --sd-sh-lg:0 14px 40px rgba(16,28,54,.14);
  --sd-scrim:rgba(11,21,36,.45);
  --r-sm:14px; --r-md:16px; --r-lg:20px; --r-xl:24px; --r-pill:999px;
  --fonte:'Inter',ui-sans-serif,system-ui,-apple-system,sans-serif;
  --fonte-d:'Sora','Inter',ui-sans-serif,system-ui,sans-serif;
}
html[data-tema="escuro"]{
  --sd-bg:#0A0F1C; --sd-surface:#121A2B; --sd-surface2:#0E1626; --sd-surface3:#182640;
  --sd-border:#212E45; --sd-border-strong:#2C3D5C;
  --sd-text:#EAF0FA; --sd-muted:#93A3BF; --sd-faint:#5E6E8C;
  --sd-primary:#5B8CFF; --sd-primary-hover:#4C7DF0; --sd-primary-soft:rgba(91,140,255,.16); --sd-on-primary:#071229;
  --sd-success:#2FD08A; --sd-success-soft:rgba(47,208,138,.14);
  --sd-danger:#FF5C5C;  --sd-danger-soft:rgba(255,92,92,.15);
  --sd-warning:#F5B23C; --sd-warning-soft:rgba(245,178,60,.15);
  --sd-cyan:#38C6E0;    --sd-cyan-soft:rgba(56,198,224,.13);
  --sd-sh-sm:0 2px 8px rgba(0,0,0,.4); --sd-sh-md:0 6px 22px rgba(0,0,0,.5);
  --sd-scrim:rgba(2,6,16,.62);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
/* Base maior para leitura em campo (sol, tela suja, pessoa de 50 anos).
   O espaçamento foi reduzido junto, para caber a mesma coisa na tela. */
html{font-size:clamp(15px,4.15vw,17px);height:100%;}
/* A cadeia de altura precisa ser contínua: html → body → #raiz → .app → .conteudo.
   Se qualquer elo ficar com altura automática, o overflow interno não rola. */
body{margin:0;background:var(--sd-bg);color:var(--sd-text);font-family:var(--fonte);
  font-size:1rem;letter-spacing:-.005em;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s;
  height:100%;overflow:hidden;}
#raiz{height:100%;}
h1,h2,h3{font-family:var(--fonte-d);letter-spacing:-.02em;margin:0;}
.num{font-variant-numeric:tabular-nums;}
.app{max-width:460px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative;}
.conteudo{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
.oculto{display:none !important;}

/* topo */
.appbar{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:11px 14px;
  background:var(--sd-surface);border-bottom:1px solid var(--sd-border);min-width:0;}
.hamb{background:none;border:none;color:var(--sd-muted);font-size:1.45rem;cursor:pointer;
  padding:0 2px 0 0;line-height:1;flex:0 0 auto;}
.appbar-title{flex:1 1 auto;min-width:0;overflow:hidden;}
.appbar-title h1{font-size:1.06rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.appbar-title .sub{font-size:.72rem;color:var(--sd-muted);font-weight:500;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.db{flex:0 0 auto;background:var(--sd-surface2);border:1px solid var(--sd-border);color:var(--sd-muted);
  border-radius:var(--r-pill);font-size:.75rem;padding:5px 10px;font-weight:600;white-space:nowrap;}

/* gaveta */
.drawer-overlay{position:fixed;inset:0;background:var(--sd-scrim);opacity:0;visibility:hidden;
  transition:opacity .25s,visibility .25s;z-index:60;}
.drawer-overlay.open{opacity:1;visibility:visible;}
.drawer{position:fixed;top:0;left:0;bottom:0;width:80%;max-width:300px;background:var(--sd-surface);
  border-right:1px solid var(--sd-border);box-shadow:var(--sd-sh-lg);transform:translateX(-100%);
  transition:transform .25s ease;z-index:70;display:flex;flex-direction:column;}
.drawer.open{transform:none;}
.drawer-head{padding:18px 16px 14px;border-bottom:1px solid var(--sd-border);}
.drawer-head h2{font-size:1.1rem;color:var(--sd-primary);}
.drawer-nav{flex:1;padding:10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;}
.dnav{border-radius:var(--r-md);color:var(--sd-muted);background:transparent;border:none;
  font-family:var(--fonte);font-size:.94rem;font-weight:500;padding:11px 12px;text-align:left;cursor:pointer;
  transition:background .16s,color .16s;display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;}
.dnav:hover{background:var(--sd-surface3);color:var(--sd-text);}
.dnav.active{background:var(--sd-primary-soft);color:var(--sd-primary);font-weight:600;}
.drawer-foot{border-top:1px solid var(--sd-border);padding:12px;}

/* conteúdo */
.view{padding:12px 15px 20px;animation:sdUp .4s cubic-bezier(.2,.7,.3,1) both;}
@keyframes sdUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.view-head{margin:6px 4px 12px;}
.view-head h2{font-size:1.32rem;font-weight:700;line-height:1.22;overflow-wrap:anywhere;}
.view-head .meta{font-size:.86rem;color:var(--sd-muted);margin-top:4px;font-weight:500;}
.secao{font-size:.82rem;font-weight:700;color:var(--sd-muted);text-transform:uppercase;letter-spacing:.05em;
  margin:17px 4px 8px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.volta{background:none;border:none;color:var(--sd-primary);font:600 .9rem var(--fonte);cursor:pointer;padding:0 0 10px 4px;}

/* cartões */
.card-item{background:var(--sd-surface);border:1px solid var(--sd-border);border-radius:var(--r-lg);
  box-shadow:var(--sd-sh-sm);padding:14px 15px;margin-bottom:9px;}
.card-item h3{font-family:var(--fonte-d);font-size:1.02rem;font-weight:600;color:var(--sd-text);letter-spacing:-.01em;}
.card-item .meta,.meta{font-size:.86rem;color:var(--sd-muted);margin-top:3px;line-height:1.4;}
.card-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.card-row>div:first-child{min-width:0;flex:1;}
.card-btn{width:100%;text-align:left;background:var(--sd-surface);border:1px solid var(--sd-border);
  border-radius:var(--r-lg);box-shadow:var(--sd-sh-sm);padding:15px;margin-bottom:11px;cursor:pointer;
  font:inherit;color:inherit;transition:transform .12s,box-shadow .12s;}
.card-btn:active{transform:translateY(1px);box-shadow:none;}

/* chips */
.chip{display:inline-block;border-radius:var(--r-pill);font-weight:700;font-size:.78rem;padding:4px 10px;
  white-space:nowrap;margin-top:7px;max-width:100%;}
/* Rotulo curto usa .chip. Frase longa usa .aviso-linha, que quebra. */
.aviso-linha{display:block;border-radius:var(--r-md);font-weight:600;font-size:.79rem;
  padding:9px 12px;margin-top:9px;line-height:1.45;}
.aviso-linha.warn{background:var(--sd-warning-soft);color:var(--sd-warning);}
.chip.info{background:var(--sd-primary-soft);color:var(--sd-primary);}
.chip.ok{background:var(--sd-success-soft);color:var(--sd-success);}
.chip.warn{background:var(--sd-warning-soft);color:var(--sd-warning);}
.chip.bad{background:var(--sd-danger-soft);color:var(--sd-danger);}
.chip.neutro{background:var(--sd-surface3);color:var(--sd-muted);}
.chip.cyan{background:var(--sd-cyan-soft);color:var(--sd-cyan);}
.chip.sem-margem{margin:0;}

/* botões */
.btn{border:1px solid transparent;border-radius:15px;font-family:var(--fonte);font-weight:700;
  padding:13px 18px;font-size:.95rem;letter-spacing:-.01em;cursor:pointer;}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--sd-primary);color:#fff;box-shadow:0 6px 18px rgba(27,77,228,.24);}
.btn-primary:active{background:var(--sd-primary-hover);}
.btn-primary:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;}
.btn-ghost{background:var(--sd-surface);border-color:var(--sd-border);color:var(--sd-text);box-shadow:var(--sd-sh-sm);}
.btn-add{background:var(--sd-primary-soft);color:var(--sd-primary);border:none;border-radius:14px;
  padding:9px 15px;font-weight:700;font-size:.85rem;cursor:pointer;}
.btn-bloco{width:100%;margin-top:6px;}

/* formulário */
.campo{margin-bottom:12px;}
.campo label{display:block;font-size:.85rem;font-weight:600;color:var(--sd-muted);margin-bottom:5px;}
.campo input,.campo select,.campo textarea{width:100%;border:1px solid var(--sd-border);border-radius:var(--r-md);
  background:var(--sd-surface);padding:12px 13px;font:500 .95rem var(--fonte);color:var(--sd-text);}
.campo input:focus,.campo select:focus,.campo textarea:focus{outline:2px solid var(--sd-primary);
  outline-offset:1px;border-color:transparent;}
.dupla{display:flex;gap:10px;}
/* min-width:0 e obrigatorio: sem ele um <select> com opcao longa
   ("Titulo de capitalizacao") nao encolhe e estoura a largura da tela. */
.dupla>*{flex:1;min-width:0;}
.dupla select,.dupla input{width:100%;max-width:100%;}
.escolha{display:flex;flex-direction:column;gap:9px;}
.escolha button{text-align:left;padding:15px;border-radius:var(--r-lg);cursor:pointer;background:var(--sd-surface);
  border:1px solid var(--sd-border);font:inherit;color:inherit;width:100%;}
.escolha .t{font-weight:700;font-size:.98rem;}
.escolha .d{font-size:.82rem;color:var(--sd-muted);margin-top:3px;}
.erro{background:var(--sd-danger-soft);color:var(--sd-danger);border-radius:var(--r-md);padding:11px 13px;
  font-size:.85rem;font-weight:600;margin-bottom:12px;}

/* itens da vistoria */
.linha-item{padding:11px 0;border-bottom:1px solid var(--sd-border);}
.linha-item:last-child{border-bottom:0;padding-bottom:0;}
.linha-item .pergunta{font-size:1rem;font-weight:600;margin-bottom:9px;line-height:1.3;}
.estados{display:flex;flex-wrap:wrap;gap:6px;}
.estados button{flex:1 1 auto;min-width:58px;padding:10px 5px;border:1px solid var(--sd-border);
  border-radius:var(--r-sm);cursor:pointer;background:var(--sd-surface2);color:var(--sd-muted);
  font:700 .84rem var(--fonte);transition:background .14s,color .14s,border-color .14s;}
.estados button[data-e="novo"]{background:var(--sd-primary-soft);color:var(--sd-primary);border-color:transparent;}
.estados button[data-e="bom"]{background:var(--sd-success-soft);color:var(--sd-success);border-color:transparent;}
.estados button[data-e="regular"]{background:var(--sd-warning-soft);color:var(--sd-warning);border-color:transparent;}
.estados button[data-e="ruim"],.estados button[data-e="ausente"]{background:var(--sd-danger-soft);color:var(--sd-danger);border-color:transparent;}
.obs{width:100%;margin-top:10px;border:1px solid var(--sd-border);border-radius:var(--r-md);
  background:var(--sd-surface2);padding:11px 12px;font:500 .9rem var(--fonte);color:var(--sd-text);
  resize:vertical;min-height:62px;}
.obs:focus{outline:2px solid var(--sd-primary);outline-offset:1px;}
.fotos{display:flex;gap:8px;align-items:center;margin-top:9px;flex-wrap:wrap;}
.addfoto{border:1px dashed var(--sd-border-strong);border-radius:var(--r-md);background:var(--sd-surface2);
  color:var(--sd-muted);width:58px;height:58px;cursor:pointer;font-size:1.4rem;line-height:1;}
.thumb{width:58px;height:58px;border-radius:var(--r-md);object-fit:cover;background:var(--sd-surface3);}
.anterior{font-size:.74rem;color:var(--sd-cyan);background:var(--sd-cyan-soft);border-radius:var(--r-pill);
  padding:3px 9px;display:inline-block;margin-bottom:7px;font-weight:600;}

/* números e ficha */
.numeros{display:flex;gap:9px;}
.numeros>div{flex:1;background:var(--sd-surface);border:1px solid var(--sd-border);border-radius:var(--r-lg);
  box-shadow:var(--sd-sh-sm);padding:13px 9px;text-align:center;}
.numeros .n{font-family:var(--fonte-d);font-size:1.6rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;}
.numeros .l{font-size:.76rem;font-weight:600;color:var(--sd-muted);margin-top:6px;line-height:1.25;}
.ficha dl{margin:12px 0 0;display:grid;grid-template-columns:auto 1fr;gap:9px 14px;}
.ficha dt{font-size:.86rem;color:var(--sd-muted);font-weight:500;}
.ficha dd{margin:0;font-size:.88rem;font-weight:600;text-align:right;overflow-wrap:anywhere;}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.76rem;
  overflow-wrap:anywhere;}

.empty{color:var(--sd-faint);font-size:.9rem;text-align:center;margin:20px 8px;line-height:1.45;}
.empty b{display:block;color:var(--sd-muted);font-size:.95rem;margin-bottom:4px;}

.barra{flex:0 0 auto;padding:12px 14px calc(14px + env(safe-area-inset-bottom));
  background:var(--sd-surface);border-top:1px solid var(--sd-border);
  display:flex;gap:10px;align-items:center;}
.barra .info{flex:1;font-size:.84rem;color:var(--sd-muted);font-weight:500;line-height:1.4;}
.barra .info b{color:var(--sd-text);font-weight:700;}

/* atalhos: grade de acesso rápido, no espírito do Elo Compras */
.atalhos{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.atalho{background:var(--sd-surface);border:1px solid var(--sd-border);border-radius:var(--r-lg);
  box-shadow:var(--sd-sh-sm);padding:13px 13px;cursor:pointer;text-align:left;font:inherit;color:inherit;
  display:flex;flex-direction:column;gap:10px;min-height:104px;justify-content:space-between;
  transition:transform .12s,box-shadow .12s;}
.atalho:active{transform:translateY(1px);box-shadow:none;}
.atalho .ic{width:38px;height:38px;border-radius:12px;background:var(--sd-primary-soft);
  display:flex;align-items:center;justify-content:center;}
.atalho .ic svg{width:20px;height:20px;stroke:var(--sd-primary);fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round;}
.atalho .rot{font-weight:700;font-size:.92rem;letter-spacing:-.01em;}
.atalho .sub{font-size:.79rem;color:var(--sd-muted);font-weight:500;margin-top:2px;}
.atalho.destaque{grid-column:1 / -1;flex-direction:row;align-items:center;min-height:0;gap:13px;}
.atalho.destaque .ic{background:var(--sd-primary);}
.atalho.destaque .ic svg{stroke:#fff;}
.atalho.destaque .txt{flex:1;}

/* linha de ações do imóvel */
.acoes-linha{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.acao-min{background:var(--sd-surface2);border:1px solid var(--sd-border);border-radius:var(--r-pill);
  padding:8px 13px;font:600 .84rem var(--fonte);color:var(--sd-muted);cursor:pointer;
  text-decoration:none;display:inline-flex;align-items:center;gap:5px;}
.acao-min:hover{background:var(--sd-surface3);color:var(--sd-text);}

.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:var(--sd-text);
  color:var(--sd-bg);padding:12px 20px;border-radius:var(--r-pill);font:600 .84rem var(--fonte);
  z-index:80;box-shadow:var(--sd-sh-md);max-width:88%;text-align:center;}
.auth-wrap{flex:1 1 auto;min-height:0;overflow-y:auto;}

.carregando{padding:60px 20px;text-align:center;color:var(--sd-muted);font-size:.95rem;}

/* busca e filtros */
.buscador{display:flex;gap:8px;}
.buscador input{flex:1;min-width:0;border:1px solid var(--sd-border);border-radius:var(--r-md);
  background:var(--sd-surface);padding:12px 13px;font:500 .95rem var(--fonte);color:var(--sd-text);}
.buscador input:focus{outline:2px solid var(--sd-primary);outline-offset:1px;border-color:transparent;}
.buscador .btn{padding:12px 16px;flex:0 0 auto;}
.filtros{display:flex;gap:6px;overflow-x:auto;padding:4px 4px 8px;scrollbar-width:none;}
.filtros::-webkit-scrollbar{display:none;}
.fchip{flex:0 0 auto;border:1px solid var(--sd-border);background:var(--sd-surface);color:var(--sd-muted);
  border-radius:var(--r-pill);padding:8px 13px;font:600 .84rem var(--fonte);cursor:pointer;white-space:nowrap;}
.fchip b{color:var(--sd-faint);font-weight:700;margin-left:3px;}
.fchip.on{background:var(--sd-primary);border-color:var(--sd-primary);color:#fff;}
.fchip.on b{color:rgba(255,255,255,.75);}
.preco{font-family:var(--fonte-d);font-weight:700;font-size:1.02rem;color:var(--sd-primary);margin-top:5px;}
.marcadores{display:flex;gap:16px;margin-top:4px;}
.marca-check{display:flex;align-items:center;gap:7px;font-size:.9rem;font-weight:500;cursor:pointer;}
.marca-check input{width:19px;height:19px;accent-color:var(--sd-primary);}

/* código de autenticidade */
.autenticidade{border-color:var(--sd-success);background:var(--sd-success-soft);}
.autenticidade .meta{color:var(--sd-text);opacity:.8;line-height:1.45;}
.autenticidade .codigo{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:1.28rem;font-weight:700;letter-spacing:.08em;color:var(--sd-success);
  margin:12px 0 4px;text-align:center;}
.selo-ok{flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:var(--sd-success);
  color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.05rem;font-weight:700;}
.acao-min.destaque-acao{background:var(--sd-primary);border-color:var(--sd-primary);color:#fff;}

/* ---------- seções do relatório da ficha ---------- */
.rel-sec{background:var(--sd-surface);border:1px solid var(--sd-border);
  border-radius:var(--r-lg);margin-bottom:10px;overflow:hidden;}
.rel-sec > summary{padding:13px 15px;font-size:.92rem;font-weight:600;cursor:pointer;
  list-style:none;display:flex;align-items:center;gap:9px;}
.rel-sec > summary::-webkit-details-marker{display:none;}
.rel-sec > summary::after{content:"▾";margin-left:auto;color:var(--sd-faint);
  font-size:.85rem;transition:transform .18s;}
.rel-sec[open] > summary::after{transform:rotate(180deg);}
.rel-sec > summary .conta{font-size:.75rem;color:var(--sd-faint);font-weight:600;
  font-variant-numeric:tabular-nums;}
.rel-corpo{padding:0 15px 13px;}
.par{display:flex;justify-content:space-between;gap:14px;padding:8px 0;
  border-bottom:1px solid var(--sd-border);font-size:.85rem;}
.par:last-child{border-bottom:none;}
.par .k{color:var(--sd-muted);flex:0 0 auto;}
.par .v{font-weight:600;text-align:right;word-break:break-word;}
.item-lista{padding:11px 0;border-bottom:1px solid var(--sd-border);}
.item-lista:last-child{border-bottom:none;}
.item-lista .tit{font-size:.88rem;font-weight:600;line-height:1.3;overflow-wrap:anywhere;}
.item-lista .sub{font-size:.78rem;color:var(--sd-muted);margin-top:3px;line-height:1.45;}
.vazio-sec{font-size:.83rem;color:var(--sd-faint);padding:6px 0;}

/* ---------- parecer da ficha ---------- */
.veredito{padding:17px 15px;}
.veredito h2{font-size:1.28rem;margin:11px 0 5px;line-height:1.25;}
.veredito .expl{font-size:.88rem;color:var(--sd-muted);line-height:1.45;margin:0;}
.trilho{margin-top:18px;}
.trilho-barra{position:relative;height:10px;border-radius:var(--r-pill);overflow:hidden;
  display:flex;background:var(--sd-surface3);}
.trilho-barra i{height:100%;display:block;}
.z-nao{background:var(--sd-danger);opacity:.28;}
.z-meio{background:var(--sd-warning);opacity:.28;}
.z-ok{background:var(--sd-success);opacity:.28;}
.marcador{position:absolute;top:-5px;width:4px;height:20px;border-radius:2px;background:var(--sd-text);}
.trilho-legenda{display:flex;justify-content:space-between;margin-top:9px;font-size:.7rem;
  color:var(--sd-faint);font-weight:600;}

.pts.mais{color:var(--sd-success);} .pts.menos{color:var(--sd-danger);} .pts.zero{color:var(--sd-faint);}
.pts.trava{color:var(--sd-danger);font-size:.7rem;letter-spacing:.04em;}
.razao .t{font-size:.88rem;font-weight:600;line-height:1.35;overflow-wrap:anywhere;}
.razao .d{font-size:.79rem;color:var(--sd-muted);margin-top:3px;line-height:1.4;}

/* ---------- campo de rubrica ---------- */
.rubrica-caixa{margin-top:6px;}
.rubrica-area{position:relative;background:var(--sd-surface);border:2px dashed var(--sd-border-strong);
  border-radius:var(--r-md);overflow:hidden;touch-action:none;}
.rubrica-area.temTraco{border-style:solid;border-color:var(--sd-primary);}
.rubrica-area canvas{display:block;width:100%;height:150px;touch-action:none;cursor:crosshair;}
.rubrica-linha{position:absolute;left:8%;right:8%;bottom:34px;border-bottom:1px solid var(--sd-border-strong);
  pointer-events:none;}
.rubrica-placeholder{position:absolute;left:0;right:0;bottom:10px;text-align:center;
  font-size:.82rem;color:var(--sd-faint);pointer-events:none;}
.rubrica-area.temTraco .rubrica-placeholder,.rubrica-area.temTraco .rubrica-linha{display:none;}
.rubrica-acoes{display:flex;justify-content:space-between;align-items:center;margin-top:8px;}

/* Deitado num celular: o campo cresce e ocupa o que der. */

}

/* alternador CEP × endereço */
.alternar{display:flex;gap:5px;background:var(--sd-surface2);border-radius:var(--r-md);padding:4px;}
.alternar button{flex:1;border:none;background:transparent;border-radius:12px;padding:9px 6px;

  border-radius:var(--r-md);padding:11px 12px;margin-bottom:7px;cursor:pointer;font:inherit;color:inherit;}
.resultado:active{background:var(--sd-surface3);}


/* =====================================================================
   RESPONSIVO — o mesmo código em três leituras.
   Não detectamos o aparelho (user-agent mente); reagimos ao espaço
   disponível e ao tipo de ponteiro.
   ===================================================================== */

/* ---------- TABLET: 2 colunas de cards, gaveta ainda por botão ---------- */
@media (min-width: 700px) {
  html{font-size:15.5px;}
  .app{max-width:740px;border-left:1px solid var(--sd-border);border-right:1px solid var(--sd-border);}
  .view{padding:14px 16px 22px;}
  .view-head h2{font-size:1.7rem;}
  .appbar{padding:13px 18px;}

  /* A lista vira grade. Títulos e filtros continuam ocupando a linha toda. */
  .view{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px;align-content:start;}
  .view > .view-head,.view > .secao,.view > .numeros,.view > .filtros,
  .view > .buscador,.view > .atalhos,.view > .volta,.view > .pag-cabecalho,
  .view > .pag-rodape,.view > .meta,.view > div[style*="height"]{grid-column:1 / -1;}
  .atalhos{grid-template-columns:repeat(4,1fr);}
  .atalho.destaque{grid-column:1 / -1;}
  .view.formulario{grid-template-columns:minmax(0,1fr);}
}

/* ---------- COMPUTADOR: menu fixo à esquerda ---------- */
@media (min-width: 1024px) {
  /* No monitor a fonte não precisa crescer: a distância dos olhos é maior
     e a tela é fixa. O tamanho grande era pensado para a mão, no sol. */
  html{font-size:14.5px;}
  .app{
    max-width:1060px;height:100%;
    display:grid;
    grid-template-columns:222px minmax(0,1fr);
    grid-template-rows:minmax(0,1fr) auto;
    grid-template-areas:"nav corpo" "nav acao";
    border-left:1px solid var(--sd-border);border-right:1px solid var(--sd-border);
  }
  /* A barra do topo some: repetia a marca e o nome da conta que já estão
     no menu lateral, e cada tela tem o próprio título. */
  .appbar{display:none;}
  /* A gaveta deixa de ser gaveta: vira coluna fixa. */
  .drawer,.drawer.open{position:static;transform:none;grid-area:nav;width:auto;max-width:none;
    height:100%;box-shadow:none;border-right:1px solid var(--sd-border);}
  .drawer-overlay{display:none !important;}
  .hamb{display:none;}
  .appbar{grid-area:topo;}
  .conteudo{grid-area:corpo;}
  .barra{grid-area:acao;justify-content:flex-end;}
  .barra .info{max-width:340px;}

  /* Duas colunas bastam. Três deixava o cartão estreito e o olho perdido. */
  .view{grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px;padding:20px 22px 22px;}
  .view-head h2{font-size:1.7rem;}
  /* Formulários e documentos ocupam a largura disponível, sem sobra lateral.
     A leitura corrida é limitada por dentro, no próprio parágrafo. */
  .view.formulario{grid-template-columns:minmax(0,1fr);justify-content:stretch;}
  .atalhos{grid-template-columns:repeat(4,1fr);}
  .atalho.destaque{grid-column:span 1;flex-direction:column;align-items:flex-start;min-height:98px;}
  .buscador{max-width:560px;}
  .numeros{max-width:560px;}
  .drawer-head{padding:18px 16px 14px;}
  .dnav{font-size:.92rem;padding:10px 12px;}
  /* Barra de rolagem só quando realmente precisa, e discreta. */
  .drawer-nav{overflow-y:auto;scrollbar-width:none;}
  .drawer-nav::-webkit-scrollbar{display:none;}
  .conteudo{scrollbar-gutter:stable;scrollbar-width:thin;}

}

/* ---------- TELAS MUITO LARGAS: cresce a folga, não a quantidade ---------- */
@media (min-width: 1500px) {
  .app{max-width:1180px;}
  .view{gap:0 16px;padding:22px 26px 24px;}

/* ---------- impressão / salvar em PDF ---------- */
.pag-cabecalho,.pag-rodape{display:none;}
@media print{

    border:1px solid #bbb;border-radius:6px;margin-bottom:8px;}
  .secao{color:#000;border-bottom:1px solid #ddd;padding-bottom:3px;margin-top:14px;}
  .chip{border:1px solid #999;background:#fff !important;color:#000 !important;}
  .thumb{width:118px !important;height:118px !important;border-radius:4px;}
  .numeros>div{border:1px solid #bbb;box-shadow:none;}
  .empty{color:#555;}
  .pag-cabecalho{display:flex !important;align-items:center;gap:12px;
    border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:12px;}
  .pag-cabecalho img{height:34px;filter:none !important;}
  .pag-cabecalho .t{font-family:var(--fonte-d);font-size:14pt;font-weight:700;}
  .pag-cabecalho .s{font-size:9pt;color:#444;}
  .pag-rodape{display:block !important;margin-top:16px;padding-top:8px;
    border-top:1px solid #999;font-size:8.5pt;color:#333;line-height:1.55;}
  /* A concorrência quebra página a cada seção e gasta 10 folhas no que
     cabe em 3. Aqui as seções fluem: só evitam quebrar no meio de si mesmas. */
  .rel-sec{border:1px solid #bbb;border-radius:6px;margin-bottom:6px;
    break-inside:avoid;page-break-inside:avoid;}
  .rel-sec > summary{font-size:10.5pt;font-weight:700;border-bottom:1px solid #ddd;
    padding:6px 10px;}

  .razao{border-bottom:1px solid #eee;padding:6px 10px;}
  .razao .d{font-size:8.5pt;}
  .rubrica-final{max-height:70px;}
}

/* logo — max-width evita que uma arte larga empurre o resto da appbar.
   Se a arte for escura, o tema escuro clareia por filtro. */
.logo{display:block;object-fit:contain;flex:0 0 auto;}

  padding:14px 0 0;display:block;margin:0 auto;}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important;}}

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

/* =====================================================================
   1. CONEXÃO
   A chave publicável é pública por design — quem protege é o RLS.
   A service_role NUNCA entra aqui.
   ===================================================================== */
const SUPABASE_URL = "https://grycbyiwduorstleveym.supabase.co";
const SUPABASE_KEY = "sb_publishable_E_IedZE6HmVbsuuENh4qmw_Yw_8mvKF";
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

/* =====================================================================
   2. ESTADO E CONSTANTES
   ===================================================================== */
const ESTADOS = [["novo","Novo"],["bom","Bom"],["regular","Regular"],["ruim","Ruim"],["ausente","Ausente"]];
const ROT_ESTADO = Object.fromEntries(ESTADOS);
const RUINS = ["regular","ruim","ausente"];
const CHIP = { regular:"warn", ruim:"bad", ausente:"bad" };
const TIPO = { entrada:"Vistoria de entrada", saida:"Vistoria de saída",
               periodica:"Vistoria periódica", captacao:"Captação" };

const app = {
  sessao: null, conta: null,
  aba: "inicio", tela: null, ctx: {},
  gaveta: false, tipoEscolhido: null, modoAuth: "entrar", filtros: {},
  admin: false, vigencia: null, voltarPara: null,
};

const raiz = document.getElementById("raiz");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

function toast(msg) {
  document.querySelector(".toast")?.remove();
  const d = document.createElement("div");
  d.className = "toast"; d.textContent = msg;
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 2800);
}

const ok = ({ data, error }) => { if (error) throw new Error(error.message); return data; };

function traduzErro(msg = "") {
  const m = msg.toLowerCase();
  if (m.includes("invalid login")) return "E-mail ou senha incorretos.";
  if (m.includes("already registered")) return "Este e-mail já tem cadastro.";
  if (m.includes("password")) return "A senha precisa de pelo menos 6 caracteres.";
  if (m.includes("email not confirmed")) return "Confirme seu e-mail antes de entrar. (Ou desligue a confirmação no painel.)";
  return msg;
}

/* =====================================================================
   3. DADOS — tudo que fala com o banco fica aqui
   ===================================================================== */
const api = {
  minhaConta: async () => (ok(await sb.rpc("minha_conta")) || [])[0] ?? null,

  listarImoveis: async () => ok(await sb.from("imoveis")
    .select("*, proprietario:pessoas!imoveis_proprietario_id_fkey(id,nome,telefone)")
    .eq("arquivado", false).order("criado_em", { ascending: false })),

  async criarImovel(f) {
    let proprietario_id = null;
    if (f.proprietarioNome?.trim()) {
      const p = ok(await sb.from("pessoas").insert({
        conta_id: app.conta.conta_id, nome: f.proprietarioNome.trim(),
        telefone: f.proprietarioTelefone || null,
      }).select("id").single());
      proprietario_id = p.id;
    }
    const { data: { user } } = await sb.auth.getUser();
    return ok(await sb.from("imoveis").insert({
      conta_id: app.conta.conta_id,
      referencia: f.referencia?.trim() || null,
      finalidade: f.finalidade || "locacao",
      tipo_imovel: f.tipoImovel || null,
      cep: f.cep ? String(f.cep).replace(/\D/g, "") : null,
      logradouro: f.logradouro || null, numero: f.numero || null,
      bairro: f.bairro || null, cidade: f.cidade || null, uf: f.uf || null,
      lat: f.lat ?? null, lng: f.lng ?? null,
      quartos: f.quartos ?? null, suites: f.suites ?? null,
      banheiros: f.banheiros ?? null, vagas: f.vagas ?? null,
      area_util: f.areaUtil ?? null, area_total: f.areaTotal ?? null,
      valor_aluguel: f.valorAluguel ?? null, valor_venda: f.valorVenda ?? null,
      valor_condominio: f.valorCondominio ?? null, valor_iptu: f.valorIptu ?? null,
      mobiliado: !!f.mobiliado, aceita_pet: !!f.aceitaPet,
      resumo: f.resumo || null, proprietario_id, corretor_id: user?.id ?? null,
    }).select().single());
  },

  imovel: async (id) => ok(await sb.from("imoveis")
    .select("*, proprietario:pessoas!imoveis_proprietario_id_fkey(id,nome,telefone)")
    .eq("id", id).single()),

  async atualizarImovel(id, f, proprietarioAtualId) {
    // Proprietário: atualiza a pessoa existente, ou cria se ainda não houver.
    let proprietario_id = proprietarioAtualId ?? null;
    const nome = f.proprietarioNome?.trim();
    if (nome) {
      if (proprietario_id) {
        ok(await sb.from("pessoas")
          .update({ nome, telefone: f.proprietarioTelefone || null })
          .eq("id", proprietario_id));
      } else {
        const pessoa = ok(await sb.from("pessoas")
          .insert({ conta_id: app.conta.conta_id, nome, telefone: f.proprietarioTelefone || null })
          .select("id").single());
        proprietario_id = pessoa.id;
      }
    }
    return ok(await sb.from("imoveis").update({
      referencia: f.referencia?.trim() || null,
      finalidade: f.finalidade, status: f.status,
      tipo_imovel: f.tipoImovel || null,
      cep: f.cep ? String(f.cep).replace(/\D/g, "") : null,
      logradouro: f.logradouro || null, numero: f.numero || null,
      bairro: f.bairro || null, cidade: f.cidade || null, uf: f.uf || null,
      lat: f.lat ?? null, lng: f.lng ?? null,
      quartos: f.quartos ?? null, suites: f.suites ?? null,
      banheiros: f.banheiros ?? null, vagas: f.vagas ?? null,
      area_util: f.areaUtil ?? null, area_total: f.areaTotal ?? null,
      valor_aluguel: f.valorAluguel ?? null, valor_venda: f.valorVenda ?? null,
      valor_condominio: f.valorCondominio ?? null, valor_iptu: f.valorIptu ?? null,
      mobiliado: !!f.mobiliado, aceita_pet: !!f.aceitaPet,
      resumo: f.resumo || null, proprietario_id,
    }).eq("id", id).select().single());
  },

  // Arquivar em vez de apagar: laudos e contratos precisam do imóvel de origem.
  arquivarImovel: async (id) => ok(await sb.from("imoveis")
    .update({ arquivado: true }).eq("id", id)),

  mudarStatusImovel: async (id, status) => ok(await sb.from("imoveis")
    .update({ status }).eq("id", id)),

  buscarImoveis: async (filtros = {}) => ok(await sb.rpc("buscar_imoveis", {
    p_texto: filtros.texto || null,
    p_cidade: filtros.cidade || null,
    p_bairro: filtros.bairro || null,
    p_finalidade: filtros.finalidade || null,
    p_tipo: filtros.tipo || null,
    p_status: filtros.status || null,
    p_quartos_min: filtros.quartosMin ?? null,
    p_valor_max: filtros.valorMax ?? null,
    p_mobiliado: filtros.mobiliado ?? null,
    p_aceita_pet: filtros.aceitaPet ?? null,
  })),

  resumoCarteira: async () => ok(await sb.rpc("resumo_carteira")),

  iniciarVistoria: async (imovelId, tipo) =>
    ok(await sb.rpc("iniciar_vistoria", { p_imovel: imovelId, p_tipo: tipo })),

  async carregarVistoria(id) {
    const vistoria = ok(await sb.from("vistorias")
      .select("*, imovel:imoveis(*)").eq("id", id).single());
    const ambientes = ok(await sb.from("ambientes")
      .select("id,nome,ordem,itens(id,descricao,estado,observacao,ordem,midias(id,caminho))")
      .eq("vistoria_id", id).order("ordem"));
    ambientes.forEach((a) => a.itens.sort((x, y) => x.ordem - y.ordem));
    return { vistoria, ambientes };
  },

  vistoriasAbertas: async () => ok(await sb.from("vistorias")
    .select("*, imovel:imoveis(referencia,bairro)")
    .in("status", ["rascunho","em_campo"]).order("criada_em", { ascending: false })),

  atualizarItem: async (id, campos) => ok(await sb.from("itens").update(campos).eq("id", id).select().single()),

  excluirVistoria: async (id) => ok(await sb.rpc("excluir_vistoria", { p_vistoria: id })),
  excluirLaudo: async (id) => ok(await sb.rpc("excluir_laudo_teste", { p_laudo: id })),

  async enviarFoto(file, vistoriaId, itemId) {
    const buf = await crypto.subtle.digest("SHA-256", await file.arrayBuffer());
    const sha256 = Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
    const ext = (file.name.split(".").pop() || "jpg").toLowerCase();
    // Caminho {conta_id}/{vistoria_id}/... — a policy do Storage valida a 1ª pasta.
    const caminho = `${app.conta.conta_id}/${vistoriaId}/${sha256.slice(0, 16)}.${ext}`;
    const { error } = await sb.storage.from("midias").upload(caminho, file, { contentType: file.type });
    // Mesmo hash = mesmo arquivo. Duplicata não é erro, é economia.
    if (error && !String(error.message).includes("already exists")) throw new Error(error.message);
    return ok(await sb.from("midias").insert({
      item_id: itemId, caminho, sha256,
      capturada_em: file.lastModified ? new Date(file.lastModified).toISOString() : null,
    }).select("id,caminho").single());

// ViaCEP é a fonte principal; BrasilAPI entra se a primeira falhar.
async function buscarCep(cep) {
  const limpo = String(cep).replace(/\D/g, "");
  if (limpo.length !== 8) throw new Error("CEP precisa ter 8 dígitos");

  try {
    const r = await fetch(`https://viacep.com.br/ws/${limpo}/json/`);
    const d = await r.json();
    if (!d.erro) {
      return { logradouro: d.logradouro, bairro: d.bairro, cidade: d.localidade, uf: d.uf };
    }
  } catch (e) { /* cai para a alternativa */ }

  const r2 = await fetch(`https://brasilapi.com.br/api/cep/v1/${limpo}`);
  if (!r2.ok) throw new Error("CEP não encontrado");
  const d2 = await r2.json();
  return { logradouro: d2.street, bairro: d2.neighborhood, cidade: d2.city, uf: d2.state };
}

// Caminho inverso: com UF, cidade e rua, o ViaCEP devolve o CEP.
// Exige pelo menos 3 letras em cidade e logradouro.
async function buscarPorEndereco(uf, cidade, logradouro) {
  if (!uf || cidade.trim().length < 3 || logradouro.trim().length < 3) {
    throw new Error("Preencha UF, cidade e pelo menos 3 letras do logradouro");
  }
  const url = `https://viacep.com.br/ws/${encodeURIComponent(uf.trim())}/`
            + `${encodeURIComponent(cidade.trim())}/${encodeURIComponent(logradouro.trim())}/json/`;
  const r = await fetch(url);
  if (!r.ok) throw new Error("Não foi possível consultar o endereço");
  const lista = await r.json();
  if (!Array.isArray(lista) || lista.length === 0) throw new Error("Nenhum endereço encontrado");
  return lista.slice(0, 8).map((d) => ({
    cep: d.cep, logradouro: d.logradouro, bairro: d.bairro, cidade: d.localidade, uf: d.uf,
  }));
}

// Coordenada capturada no local vale como indício de presença.
// Por isso guardamos junto do imóvel e da mídia.
function pegarLocalizacao() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) return reject(new Error("Este aparelho não tem GPS disponível"));
    navigator.geolocation.getCurrentPosition(
      (p) => resolve({ lat: p.coords.latitude, lng: p.coords.longitude, precisao: p.coords.accuracy }),
      (e) => reject(new Error(
        e.code === 1 ? "Permissão de localização negada" : "Não foi possível obter a localização")),
      { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 }
    );
  });
}

function linkMaps(im) {
  if (im.lat && im.lng) return `https://www.google.com/maps/search/?api=1&query=${im.lat},${im.lng}`;
  const partes = [im.logradouro, im.numero, im.bairro, im.cidade, im.uf].filter(Boolean).join(", ");
  if (!partes) return null;
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(partes)}`;
}

// Interpreta o que a pessoa digitou e vira filtro.
// "casa 3 quartos balneário aluguel até 2500" → tipo, quartos, bairro, finalidade, valor.
// Roda no navegador: sem custo, sem chave de API, sem latência.
function interpretarBusca(texto, bairrosConhecidos = []) {
  const t = " " + texto.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "") + " ";
  const f = {};
  let sobra = t;
  const consumir = (re) => { sobra = sobra.replace(re, " "); };

  // Ordem importa: os mais específicos vêm antes, senão "galpão comercial"
  // seria classificado como comercial.
  const TIPOS = [["galpao","galpao"],["kitnet","kitnet"],["quitinete","kitnet"],
                 ["apartamento","apartamento"],["apto","apartamento"],["ap","apartamento"],
                 ["terreno","terreno"],["lote","terreno"],["sitio","sitio"],
                 ["casa","casa"],["loja","comercial"],["sala","comercial"],
                 ["comercial","comercial"]];
  for (const [palavra, tipo] of TIPOS) {
    const re = new RegExp(`\\b${palavra}s?\\b`);
    if (re.test(sobra)) { f.tipo = tipo; consumir(re); break; }
  }

  if (/\b(alug|locac)/.test(sobra)) { f.finalidade = "locacao"; consumir(/\b(aluguel|alugar|alugado|locacao)\b/g); }
  else if (/\b(vend|compra)/.test(sobra)) { f.finalidade = "venda"; consumir(/\b(venda|vender|comprar|compra)\b/g); }

  const q = sobra.match(/(\d+)\s*(?:quarto|dorm|qto)/);
  if (q) { f.quartosMin = Number(q[1]); consumir(/(\d+)\s*(?:quartos?|dorm\w*|qtos?)/); }

  // "até 2500", "ate 2.500", "até 350 mil", "max 1500"
  const v = sobra.match(/(?:ate|max|maximo|abaixo de)\s*r?\$?\s*([\d.,]+)\s*(mil|k)?/);
  if (v) {
    let n = Number(v[1].replace(/\./g, "").replace(",", "."));
    if (v[2]) n *= 1000;
    if (n > 0) f.valorMax = n;
    consumir(/(?:ate|max|maximo|abaixo de)\s*r?\$?\s*[\d.,]+\s*(mil|k)?/);
  }

  if (/\bmobiliad/.test(sobra)) { f.mobiliado = true; consumir(/\bmobiliad\w*\b/g); }
  if (/\b(pet|animal|animais|cachorro|gato)\b/.test(sobra)) {
    f.aceitaPet = true;
    consumir(/\b(aceita|permite|com)?\s*(pets?|animais|animal|cachorros?|gatos?)\b/g);
  }
  if (/\bdisponiv/.test(sobra)) { f.status = "disponivel"; consumir(/\bdisponiv\w*\b/g); }

  // O que sobrou pode ser bairro conhecido; senão, vira busca livre.
  const resto = sobra.replace(/\b(com|de|no|na|em|para|pra|e|o|a|os|as|um|uma|imovel|imoveis)\b/g, " ")
                     .replace(/\s+/g, " ").trim();
  if (resto) {
    const achado = bairrosConhecidos.find((b) =>
      b.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").includes(resto));
    if (achado) f.bairro = achado; else f.texto = resto;
  }
  return f;
}

// Aviso de vencimento: aparece a 10 dias do fim, e vira bloqueio depois.
function avisoVigencia() {
  const v = app.vigencia;
  if (!v) return "";
  const d = v.dias_restantes;
  if (d > 10) return "";
  const vencida = d < 0;
  return `<div class="card-item" style="border-color:var(--sd-${vencida ? "danger" : "warning"});
      background:var(--sd-${vencida ? "danger" : "warning"}-soft)">
    <h3>${vencida ? "Assinatura vencida" : d === 0 ? "Sua assinatura vence hoje" : `Faltam ${d} dias`}</h3>
    <div class="meta" style="color:var(--sd-text)">
      ${vencida
        ? "Você continua vendo seus laudos, mas não consegue criar vistorias nem cadastrar imóveis até renovar."
        : `Plano ${v.plano_nome}, válido até ${new Date(v.fim + "T12:00").toLocaleDateString("pt-BR")}.`}

}

// O hash completo tem 64 caracteres e não diz nada para quem lê.
// Mostramos um trecho legível, em grupos, e explicamos o que é.
function codigoCurto(hash) {
  if (!hash) return "—";
  const h = hash.toUpperCase();
  return `${h.slice(0, 4)}-${h.slice(4, 8)}-${h.slice(8, 12)}`;
}

function blocoAutenticidade(hash, token) {
  const base = location.origin + location.pathname.replace(/[^/]*$/, "");
  return `<div class="card-item autenticidade">
    <div class="card-row">
      <div>
        <h3>Código de autenticidade</h3>
        <div class="meta">Impressão digital deste laudo. Se qualquer detalhe mudasse,
          o código seria outro — é assim que se prova que o documento não foi alterado.</div>
      </div>
      <span class="selo-ok">✓</span>
    </div>
    <div class="codigo">${codigoCurto(hash)}</div>
    <div class="acoes-linha">
      <button class="acao-min" onclick="navigator.clipboard?.writeText('${esc(hash)}');
        eloToast('Código completo copiado')">Copiar código completo</button>
      ${token ? `<a class="acao-min" target="_blank" rel="noopener"
        href="${base}#verificar=${esc(token)}">Conferir autenticidade</a>` : ""}
    </div>

}

          <button class="resultado" data-i="${i}">
            <div style="font-weight:600">${esc(a.logradouro)}</div>
            <div class="meta">${esc(a.bairro)} · CEP ${esc(a.cep)}</div>
          </button>`).join("");
      caixa.querySelectorAll(".resultado").forEach((btn) => btn.addEventListener("click", () => {
        const a = achados[Number(btn.dataset.i)];
        document.getElementById("i_cep").value = a.cep;
        document.getElementById("i_logradouro").value = a.logradouro;
        document.getElementById("i_bairro").value = a.bairro;
        document.getElementById("i_cidade").value = a.cidade;
        document.getElementById("i_uf").value = a.uf;
        caixa.innerHTML = `<div class="meta" style="margin-top:10px">Endereço preenchido abaixo.</div>`;
        document.getElementById("i_numero").focus();
      }));
    } catch (err) { toast(err.message); }
    finally { b.disabled = false; b.textContent = "Procurar CEP"; }
  });

  document.getElementById("btnGps").addEventListener("click", async (e) => {
    const b = e.currentTarget; b.disabled = true; b.textContent = "Localizando…";
    try {
      coords = await pegarLocalizacao();
      document.getElementById("coordenadas").innerHTML =
        `Marcado: ${coords.lat.toFixed(6)}, ${coords.lng.toFixed(6)} · precisão ${Math.round(coords.precisao)} m
         · <a class="acao-min" target="_blank" rel="noopener"
              href="https://www.google.com/maps/search/?api=1&query=${coords.lat},${coords.lng}">ver no mapa</a>`;
      b.textContent = "📍 Atualizar posição";
    } catch (err) { toast(err.message); b.textContent = "📍 Estou no imóvel — marcar no mapa"; }
    finally { b.disabled = false; }
  });

  document.getElementById("btnArquivar")?.addEventListener("click", async () => {
    if (!confirm(`Arquivar ${d.codigo}? Ele sai da carteira, mas os documentos ficam.`)) return;
    try { await api.arquivarImovel(editandoId); toast("Imóvel arquivado"); ir("imoveis"); }
    catch (err) { toast(err.message); }
  });

  document.getElementById("salvarImovel").addEventListener("click", async (e) => {
    const b = e.currentTarget; b.disabled = true; b.textContent = "Salvando…";
    const num = (id) => { const x = v(id).replace(",", "."); return x ? Number(x) : null; };
    const dados = {
      cep: v("i_cep"), referencia: v("i_referencia"), finalidade: v("i_finalidade"),
      status: v("i_status"), tipoImovel: v("i_tipo") || null,
      logradouro: v("i_logradouro"), numero: v("i_numero"), bairro: v("i_bairro"),
      cidade: v("i_cidade"), uf: v("i_uf"),
      quartos: num("i_quartos"), suites: num("i_suites"),
      banheiros: num("i_banheiros"), vagas: num("i_vagas"),
      areaUtil: num("i_areaUtil"), areaTotal: num("i_areaTotal"),
      valorAluguel: num("i_vAluguel"), valorVenda: num("i_vVenda"),
      valorCondominio: num("i_vCond"), valorIptu: num("i_vIptu"),
      mobiliado: document.getElementById("i_mobiliado").checked,
      aceitaPet: document.getElementById("i_pet").checked,
      resumo: v("i_resumo"),
      lat: coords?.lat ?? null, lng: coords?.lng ?? null,
      proprietarioNome: v("i_propNome"), proprietarioTelefone: v("i_propTel"),
    };
    try {
      if (editando) {
        await api.atualizarImovel(editandoId, dados, d.proprietario_id);
        toast("Imóvel atualizado");
      } else {
        await api.criarImovel(dados);
        toast("Imóvel cadastrado");
      }
      ir("imoveis");
    } catch (err) {
      toast(err.message);
      b.disabled = false;
      b.textContent = editando ? "Salvar alterações" : "Salvar imóvel";
    }
  });
}

/* ------------------------------ VISTORIA ------------------------------ */
async function telaVistoria() {
  const { vistoriaId } = app.ctx;
  raiz.innerHTML = moldura(carregando("Carregando vistoria…"));
  ligarMoldura();

  let dados;
  try { dados = await api.carregarVistoria(vistoriaId); }
  catch (e) { toast(e.message); return voltar(); }

  const im = dados.vistoria.imovel;
  const html = dados.ambientes.map((a) => {
    const n = a.itens.filter((i) => i.estado).length;
    return `
    <div class="secao"><span>${esc(a.nome)}</span><span class="num">${n}/${a.itens.length}</span></div>
    <div class="card-item">
      ${a.itens.map((it) => {
        const anterior = it.observacao?.startsWith("Na entrada:") ? it.observacao : null;
        return `
        <div class="linha-item" data-item="${it.id}">
          ${anterior ? `<div class="anterior">${esc(anterior)}</div>` : ""}
          <div class="pergunta">${esc(it.descricao)}</div>
          <div class="estados">
            ${ESTADOS.map(([e, rot]) =>
              `<button class="est" data-v="${e}" ${it.estado === e ? `data-e="${e}"` : ""}>${rot}</button>`).join("")}
          </div>
          <div class="detalhe ${RUINS.includes(it.estado) ? "" : "oculto"}">
            <textarea class="obs" placeholder="Descreva o que viu. Ex: infiltração de 40 cm no canto direito."
              >${anterior ? "" : esc(it.observacao || "")}</textarea>
            <div class="fotos">
              <input type="file" accept="image/*" capture="environment" multiple class="inpFoto" style="display:none">
              <button class="addfoto">+</button>
              ${(it.midias || []).map((m) => `<img class="thumb" data-caminho="${esc(m.caminho)}" alt="">`).join("")}
            </div>
          </div>
        </div>`;
      }).join("")}
    </div>`;
  }).join("");

  const todos = dados.ambientes.flatMap((a) => a.itens);
  raiz.innerHTML = moldura(`<div class="view formulario">
    <button class="volta" onclick="eloVoltar()">← Voltar</button>
    <div class="view-head">
      <h2>${esc(im?.codigo || im?.referencia || "Imóvel")}</h2>
      <div class="meta">${TIPO[dados.vistoria.tipo]} · ${esc(im?.bairro || "")}</div>
      ${linkMaps(im || {}) ? `<div class="acoes-linha">
        <a class="acao-min" href="${linkMaps(im)}" target="_blank" rel="noopener">📍 Como chegar</a>
      </div>` : ""}
    </div>
    ${html}

    <div class="secao"><span>Cancelar</span></div>
    <div class="card-item">
      <div class="meta" style="margin-bottom:10px">
        Iniciou por engano? Enquanto não virar laudo publicado, a vistoria
        pode ser excluída sem deixar rastro.
      </div>
      <button class="btn btn-ghost btn-bloco" id="btnExcluirVistoria"
        style="color:var(--sd-danger)">Excluir esta vistoria</button>
    </div>
  </div>`,
  `<div class="info" id="placar"></div>
   <button class="btn btn-primary" id="btnPublicar">Publicar laudo</button>`);
  ligarMoldura();

  document.getElementById("btnExcluirVistoria").onclick = async () => {
    if (!confirm("Excluir esta vistoria? Os itens preenchidos serão perdidos.")) return;
    try { await api.excluirVistoria(vistoriaId); toast("Vistoria excluída"); ir("inicio"); }
    catch (err) { toast(err.message); }
  };

  const estados = {};
  todos.forEach((i) => (estados[i.id] = i.estado));

  function atualizarPlacar() {
    const feitos = Object.values(estados).filter(Boolean).length;
    const oc = Object.values(estados).filter((e) => RUINS.includes(e)).length;
    document.getElementById("placar").innerHTML =
      `<b class="num">${feitos}</b> de <span class="num">${todos.length}</span> itens<br>${oc} ocorrência${oc === 1 ? "" : "s"}`;
    document.getElementById("btnPublicar").disabled = feitos === 0;
  }
  atualizarPlacar();

  raiz.querySelectorAll("[data-item]").forEach((linha) => {
    const itemId = linha.dataset.item;
    const detalhe = linha.querySelector(".detalhe");

    linha.querySelectorAll(".est").forEach((b) => b.addEventListener("click", async () => {
      const novo = estados[itemId] === b.dataset.v ? null : b.dataset.v;
      estados[itemId] = novo;
      linha.querySelectorAll(".est").forEach((x) => x.removeAttribute("data-e"));
      if (novo) b.setAttribute("data-e", novo);
      detalhe.classList.toggle("oculto", !RUINS.includes(novo));
      atualizarPlacar();
      // Otimista: a tela responde na hora, o banco confirma depois.
      try { await api.atualizarItem(itemId, { estado: novo }); }
      catch (e) { toast("Não salvou: " + e.message); }
    }));

    linha.querySelector(".obs")?.addEventListener("blur", async (e) => {
      try { await api.atualizarItem(itemId, { observacao: e.target.value }); }
      catch (err) { toast("Não salvou: " + err.message); }
    });

    const inp = linha.querySelector(".inpFoto");
    linha.querySelector(".addfoto")?.addEventListener("click", () => inp.click());
    inp?.addEventListener("change", async () => {
      const btn = linha.querySelector(".addfoto");
      btn.disabled = true; btn.textContent = "…";
      try {
        for (const file of Array.from(inp.files)) {
          const m = await api.enviarFoto(file, vistoriaId, itemId);
          const img = document.createElement("img");
          img.className = "thumb"; img.dataset.caminho = m.caminho;
          linha.querySelector(".fotos").appendChild(img);
          carregarThumb(img);
        }
      } catch (e) { toast(e.message); }
      finally { btn.disabled = false; btn.textContent = "+"; inp.value = ""; }
    });
  });

  raiz.querySelectorAll(".thumb[data-caminho]").forEach(carregarThumb);

  document.getElementById("btnPublicar").addEventListener("click", async (e) => {
    const b = e.currentTarget; b.disabled = true; b.textContent = "Publicando…";
    try {
      // Cria de saída as partes que já conhecemos: proprietário (do cadastro)
      // e vistoriador (quem está logado). O inquilino entra depois, com nome.
      const partes = [];
      if (im?.proprietario_id) partes.push({ pessoa_id: im.proprietario_id, papel_parte: "proprietario" });
      partes.push({ papel_parte: "vistoriador", nome: app.conta.nome });
      const laudo = await api.publicarLaudo(vistoriaId, partes);
      if (!laudo?.out_laudo_id) throw new Error("O banco não devolveu o laudo. Tente de novo.");
      toast("Laudo publicado");
      abrir("laudo", { laudoId: laudo.out_laudo_id });
    } catch (err) { toast(err.message); b.disabled = false; b.textContent = "Publicar laudo"; }
  });
}

// Bucket é privado: cada foto precisa de URL assinada, válida por 1h.
async function carregarThumb(img) {
  const url = await api.urlFoto(img.dataset.caminho);
  if (url) img.src = url;
}

    </div>

    <div class="view-head">

            const tel = String(a.telefone || "").replace(/\D/g, "");

            const msg = encodeURIComponent(

    if (!confirm(`Remover ${b.dataset.nome} das assinaturas?`)) return;
    try { await api.removerParte(b.dataset.id); toast("Parte removida"); telaLaudo(); }
    catch (err) { toast(err.message); }
  });

  // Atalho: toca no papel que falta e o formulário já vem preenchido.
  raiz.querySelectorAll(".add-papel").forEach((b) => b.onclick = () => {
    const form = document.getElementById("formParte");
    form.classList.remove("oculto");
    document.getElementById("p_papel").value = b.dataset.papel;
    if (b.dataset.papel === "vistoriador" || b.dataset.papel === "corretor") {
      document.getElementById("p_nome").value = app.conta.nome;
    }
    form.scrollIntoView({ behavior: "smooth", block: "center" });
    document.getElementById("p_nome").focus();
  });

  const criarParte = async (btn, depois) => {
    const nome = document.getElementById("p_nome").value.trim();
    if (nome.length < 3) return toast("Informe o nome de quem vai assinar");
    const original = btn.textContent;
    btn.disabled = true; btn.textContent = "…";
    try {
      const token = await api.convidarParte(
        laudo.id,
        document.getElementById("p_papel").value,
        nome,
        document.getElementById("p_tel").value
      );
      depois(token);
    } catch (err) { toast(err.message); btn.disabled = false; btn.textContent = original; }
  };

  document.getElementById("btnSalvarParte").onclick = (e) =>
    criarParte(e.currentTarget, () => { toast("Parte adicionada"); telaLaudo(); });

  document.getElementById("btnSalvarAssinar").onclick = (e) =>
    criarParte(e.currentTarget, (token) => {
      app.voltarPara = { tela: "laudo", ctx: { laudoId: laudo.id } };
      location.hash = `assinar=${token}`;
      render();
    });

  // Dois links diferentes: leitura mostra o laudo; verificação só confirma autenticidade.
  document.getElementById("btnLink").onclick = () => {
    const base = location.origin + location.pathname.replace(/[^/]*$/, "");
    const leitura = `${base}#laudo=${laudo.token_publico}`;
    if (navigator.share) {
      navigator.share({ title: "Laudo de vistoria", url: leitura }).catch(() => {});
    } else {
      navigator.clipboard?.writeText(leitura);
      toast("Link de leitura copiado");
    }
  };
}

async function telaNovoContrato() {
  raiz.innerHTML = moldura(carregando("Carregando imóveis…"));
  ligarMoldura();

  let imoveis = [];
  try { imoveis = await api.buscarImoveis({}); } catch (e) { toast(e.message); }

  if (!imoveis.length) {
    raiz.innerHTML = moldura(`<div class="view formulario">
      <button class="volta" onclick="eloVoltar()">← Contratos</button>
      <div class="card-item"><div class="empty"><b>Nenhum imóvel na carteira</b>
        Cadastre o imóvel antes de fazer o contrato.</div>
        <button class="btn btn-primary btn-bloco" onclick="eloAbrir('novoImovel')">Cadastrar imóvel</button>
      </div></div>`);
    ligarMoldura(); return;
  }

  raiz.innerHTML = moldura(`<div class="view formulario">
    <button class="volta" onclick="eloVoltar()">← Contratos</button>
    <div class="view-head"><h2>Novo contrato</h2>
      <div class="meta">Escolha o imóvel e os valores. As partes entram na tela seguinte.</div></div>

    <div class="card-item">
      <div class="campo"><label>Imóvel</label>
        <select id="c_imovel">
          ${imoveis.map((i) => `<option value="${i.id}" data-aluguel="${i.valor_aluguel || ""}">
            ${esc(i.codigo || "—")} — ${esc(i.bairro || i.cidade || "")}</option>`).join("")}
        </select></div>
      <div class="campo"><label>Finalidade</label>
        <select id="c_uso">
          <option value="residencial">Residencial</option>
          <option value="não residencial">Não residencial</option>
          <option value="por temporada">Por temporada</option>
        </select></div>
    </div>

    <div class="secao"><span>Valores</span></div>
    <div class="card-item">
      <div class="dupla">
        <div class="campo"><label>Aluguel (R$)</label><input id="c_aluguel" inputmode="decimal"></div>
        <div class="campo"><label>Vencimento (dia)</label><input id="c_dia" inputmode="numeric" value="5"></div>
      </div>
      <div class="dupla">
        <div class="campo"><label>Condomínio (R$)</label><input id="c_cond" inputmode="decimal"></div>
        <div class="campo"><label>IPTU (R$)</label><input id="c_iptu" inputmode="decimal"></div>
      </div>
      <div class="campo"><label>Índice de reajuste</label>
        <select id="c_indice">
          <option value="IPCA">IPCA</option>
          <option value="IGP-M">IGP-M</option>
          <option value="INPC">INPC</option>
        </select></div>
    </div>

    <div class="secao"><span>Prazo</span></div>
    <div class="card-item">
      <div class="campo"><label>Início</label><input id="c_inicio" type="date"></div>
      <div class="campo"><label>Duração</label>
        <div class="filtros" style="padding:0">
          ${[12, 24, 30, 36].map((m) =>
            `<button class="fchip c_prazo ${m === 30 ? "on" : ""}" data-m="${m}">${m} meses</button>`).join("")}
        </div>
      </div>
      <div class="meta" id="c_fim">Término: —</div>
    </div>

    <div class="secao"><span>Garantia</span></div>
    <div class="card-item">
      <div class="campo"><label>Modalidade</label>
        <select id="c_garantia">
          <option value="caucao">Caução em dinheiro</option>
          <option value="fiador">Fiador</option>
          <option value="seguro_fianca">Seguro-fiança</option>
          <option value="titulo_capitalizacao">Título de capitalização</option>
          <option value="sem_garantia">Sem garantia</option>
        </select></div>
      <div class="campo" id="campoGarantia"><label>Valor da garantia (R$)</label>
        <input id="c_valorGarantia" inputmode="decimal"></div>
      <div class="meta">A caução em dinheiro não pode passar de 3 aluguéis (art. 38, §2º).</div>
    </div>
  </div>`,
  `<button class="btn btn-primary" style="flex:1" id="btnCriarContrato">Criar e definir partes</button>`);
  ligarMoldura();

  const hoje = new Date().toISOString().slice(0, 10);
  document.getElementById("c_inicio").value = hoje;
  let prazo = 30;

  const sel = document.getElementById("c_imovel");
  const puxaAluguel = () => {
    const v = sel.selectedOptions[0]?.dataset.aluguel;
    if (v) document.getElementById("c_aluguel").value = v;
    sugereCaucao();
  };
  sel.onchange = puxaAluguel;

  function calculaFim() {
    const ini = document.getElementById("c_inicio").value;
    if (!ini) return;
    const d = new Date(ini + "T12:00");
    d.setMonth(d.getMonth() + prazo);
    document.getElementById("c_fim").textContent =
      `Término: ${d.toLocaleDateString("pt-BR")} (${prazo} meses)`;
  }
  function sugereCaucao() {
    if (document.getElementById("c_garantia").value !== "caucao") return;
    const al = Number(document.getElementById("c_aluguel").value.replace(",", ".")) || 0;
    if (al) document.getElementById("c_valorGarantia").value = (al * 3).toFixed(2);
  }

  raiz.querySelectorAll(".c_prazo").forEach((b) => b.onclick = () => {
    raiz.querySelectorAll(".c_prazo").forEach((x) => x.classList.remove("on"));
    b.classList.add("on"); prazo = Number(b.dataset.m); calculaFim();
  });
  document.getElementById("c_inicio").onchange = calculaFim;
  document.getElementById("c_aluguel").oninput = sugereCaucao;
  document.getElementById("c_garantia").onchange = (e) => {
    const mostra = ["caucao", "titulo_capitalizacao"].includes(e.target.value);
    document.getElementById("campoGarantia").classList.toggle("oculto", !mostra);
    sugereCaucao();
  };
  puxaAluguel(); calculaFim();

  document.getElementById("btnCriarContrato").onclick = async (e) => {
    const b = e.currentTarget;
    const num = (id) => { const x = document.getElementById(id).value.replace(",", "."); return x ? Number(x) : null; };
    const inicio = document.getElementById("c_inicio").value;
    if (!inicio) return toast("Informe a data de início");
    const fim = new Date(inicio + "T12:00");
    fim.setMonth(fim.getMonth() + prazo);

    b.disabled = true; b.textContent = "Criando…";
    try {
      const ct = await api.criarContrato({
        imovel_id: sel.value,
        finalidade_uso: document.getElementById("c_uso").value,
        valor_aluguel: num("c_aluguel"),
        valor_condominio: num("c_cond"),
        valor_iptu: num("c_iptu"),
        dia_vencimento: num("c_dia") || 5,
        indice_reajuste: document.getElementById("c_indice").value,
        inicio, fim: fim.toISOString().slice(0, 10), prazo_meses: prazo,
        tipo_garantia: document.getElementById("c_garantia").value,
        valor_garantia: num("c_valorGarantia"),
      });
      abrir("contrato", { contratoId: ct.id });
    } catch (err) { toast(err.message); b.disabled = false; b.textContent = "Criar e definir partes"; }
  };
}


async function telaContrato() {
  const { contratoId } = app.ctx;
  raiz.innerHTML = moldura(carregando("Carregando contrato…"));
  ligarMoldura();

  let ct, partes = [], assinaturas = [], laudos = [];
  try {
    ct = await api.contrato(contratoId);
    [partes, assinaturas] = await Promise.all([
      api.partesContrato(contratoId), api.assinaturasContrato(contratoId),
    ]);
    if (!ct.publicado_em) laudos = await api.laudosDoImovel(ct.imovel_id);
  } catch (e) { toast(e.message); return voltar(); }

  const publicado = !!ct.publicado_em;
  const locadores = partes.filter((p) => p.papel === "proprietario");
  const locatarios = partes.filter((p) => p.papel === "inquilino");
  const podePublicar = locadores.length > 0 && locatarios.length > 0;

  const linhaParte = (p) => `
    <div class="card-row" style="padding:9px 0;border-bottom:1px solid var(--sd-border)">
      <div>
        <div style="font-weight:600">${esc(p.nome)}</div>
        <div class="meta">${ROT_PAPEL[p.papel]}${p.cpf_cnpj ? " · " + esc(p.cpf_cnpj) : ""}</div>
      </div>
      ${publicado ? "" : `<button class="acao-min del-parte" data-id="${p.id}">✕</button>`}
    </div>`;

  const corpo = publicado
    ? `${blocoAutenticidade(ct.sha256, ct.token_publico)}
       <div class="secao"><span>Assinaturas</span>
         <span class="num">${assinaturas.filter((a) => a.status === "assinada").length}/${assinaturas.length}</span></div>
       <div class="card-item">
         ${assinaturas.map((a) => {
           const tel = String(a.telefone || "").replace(/\D/g, "");
           const base = location.origin + location.pathname.replace(/[^/]*$/, "");
           const link = `${base}#assinar=${a.token}`;
           const msg = encodeURIComponent(
             `Olá${a.nome_parte ? ", " + a.nome_parte : ""}! Segue o contrato de locação para sua assinatura:\n${link}`);
           return `
           <div style="padding:11px 0;border-bottom:1px solid var(--sd-border)">
             <div class="card-row">
               <div>
                 <div style="font-weight:600">${esc(a.nome_parte || "—")}</div>
                 <div class="meta">${ROT_PAPEL[a.papel_parte]}${
                   a.assinada_em && a.status === "assinada"
                     ? " · " + new Date(a.assinada_em).toLocaleString("pt-BR") : ""}</div>
               </div>
               <span class="chip ${a.status === "assinada" ? "ok" : a.status === "recusada" ? "bad" : "warn"} sem-margem">
                 ${a.status === "assinada" ? "Assinou" : a.status === "recusada" ? "Recusou" : "Pendente"}</span>
             </div>
             ${a.rubrica ? `<img class="rubrica-final" src="${esc(a.rubrica)}" alt="Rubrica">` : ""}
             ${a.status === "pendente" ? `
               <div class="acoes-linha">
                 <button class="acao-min destaque-acao assinar-ct" data-token="${esc(a.token)}">✍️ Assinar aqui</button>
                 ${tel ? `<a class="acao-min" target="_blank" rel="noopener"
                      href="https://wa.me/55${tel}?text=${msg}">💬 WhatsApp</a>` : ""}
                 <button class="acao-min copiar" data-link="${esc(link)}">🔗 Copiar link</button>
               </div>` : ""}
           </div>`;
         }).join("")}
       </div>
       <div class="secao"><span>Contrato</span></div>
       ${textoContrato(ct.conteudo)}`
    : `<div class="secao"><span>Locadores (proprietários)</span></div>
       <div class="card-item">
         ${locadores.length ? locadores.map(linhaParte).join("")
           : `<div class="empty">Nenhum locador. Todos os proprietários precisam assinar.</div>`}
         <button class="btn-add add-parte" data-papel="proprietario" style="margin-top:10px">+ Locador</button>
       </div>

       <div class="secao"><span>Locatários (inquilinos)</span></div>
       <div class="card-item">
         ${locatarios.length ? locatarios.map(linhaParte).join("")
           : `<div class="empty">Nenhum locatário cadastrado.</div>`}
         <button class="btn-add add-parte" data-papel="inquilino" style="margin-top:10px">+ Locatário</button>
       </div>

       ${ct.tipo_garantia === "fiador" ? `
         <div class="secao"><span>Fiadores</span></div>
         <div class="card-item">
           ${partes.filter((p) => p.papel === "fiador").map(linhaParte).join("") ||
             `<div class="empty">A garantia escolhida foi fiança: cadastre o fiador.</div>`}
           <button class="btn-add add-parte" data-papel="fiador" style="margin-top:10px">+ Fiador</button>
         </div>` : ""}

       <div class="secao"><span>Cláusulas complementares</span></div>
       <div class="card-item">
         <textarea class="obs" id="c_extras" style="min-height:90px"

       <div class="secao"><span>Prévia do contrato</span></div>
       ${textoContrato({
         imovel: ct.imovel || {}, partes,
         valores: { aluguel: ct.valor_aluguel, condominio: ct.valor_condominio, iptu: ct.valor_iptu,
                    dia_vencimento: ct.dia_vencimento, indice_reajuste: ct.indice_reajuste,
                    garantia: ct.tipo_garantia, valor_garantia: ct.valor_garantia,
                    multa_meses: ct.multa_meses },
         prazo: { inicio: ct.inicio, fim: ct.fim, meses: ct.prazo_meses },
         finalidade_uso: ct.finalidade_uso, clausulas_extras: ct.clausulas_extras,
         conta: { nome: app.conta.nome }, laudo_entrada: null,
       })}`;

  raiz.innerHTML = moldura(`<div class="view formulario">
    <div class="pag-cabecalho">
      <img src="logoelo.png" alt="Elo" onerror="this.remove()">
      <div><div class="t">Contrato de locação</div>
        <div class="s">${esc(app.conta.nome)}</div></div>
    </div>
    <button class="volta" onclick="eloIr('contratos')">← Contratos</button>
    <div class="view-head">
      <h2>${esc(ct.imovel?.codigo || ct.imovel?.referencia || "Contrato")}</h2>
      <div class="meta">${esc(ct.imovel?.bairro || "")} · ${brl(ct.valor_aluguel) || "—"}/mês ·
        ${ct.prazo_meses || "—"} meses</div>
      <span class="chip ${CHIP_STATUS_CT[ct.status]}">${ROT_STATUS_CT[ct.status]}</span>
    </div>
    ${corpo}
    ${publicado ? `<div class="pag-rodape">
      Contrato emitido eletronicamente pelo Elo IMOB em
      ${new Date(ct.publicado_em).toLocaleString("pt-BR")}.<br>
      Código de autenticidade (SHA-256): ${esc(ct.sha256)}
    </div>` : ""}
  </div>`,
  publicado
    ? `<button class="btn btn-ghost" id="btnPdfCt">PDF</button>
       <button class="btn btn-primary" style="flex:1" id="btnLinkCt">Copiar link de leitura</button>`
    : `<div class="info">${podePublicar ? "Revise a prévia antes de publicar" : "Falta locador ou locatário"}</div>
       <button class="btn btn-primary" id="btnPublicarCt" ${podePublicar ? "" : "disabled"}>Publicar</button>`);

  if (publicado) {

    document.getElementById("btnLinkCt").onclick = () => {
      const base = location.origin + location.pathname.replace(/[^/]*$/, "");

      location.hash = `assinar=${b.dataset.token}`;

  raiz.querySelectorAll(".add-parte").forEach((b) => b.onclick = () => {
    const form = document.getElementById("formParteCt");

    form.querySelector("h3").textContent =
      b.dataset.papel === "proprietario" ? "Novo locador"
      : b.dataset.papel === "inquilino" ? "Novo locatário" : "Novo fiador";
    form.scrollIntoView({ behavior: "smooth", block: "center" });
    document.getElementById("pc_nome").focus();

  document.getElementById("btnSalvarParteCt").onclick = async (e) => {
    const nome = document.getElementById("pc_nome").value.trim();
    if (nome.length < 3) return toast("Informe o nome completo");
    const b = e.currentTarget; b.disabled = true; b.textContent = "…";
    try {
      await api.addParteContrato(contratoId, {
        papel: document.getElementById("pc_papel").value,
        nome,
        cpf_cnpj: document.getElementById("pc_cpf").value || null,
        telefone: document.getElementById("pc_tel").value || null,
        endereco: document.getElementById("pc_end").value || null,

      toast("Parte adicionada");
      telaContrato();

  document.getElementById("c_laudo")?.addEventListener("change", async (e) => {

  });

  document.getElementById("c_extras")?.addEventListener("blur", async (e) => {
    try { await api.atualizarContrato(contratoId, { clausulas_extras: e.target.value }); }
    catch (err) { toast(err.message); }
  });

  document.getElementById("btnPublicarCt").onclick = async (e) => {
    if (!confirm("Publicar o contrato? Depois disso o texto não pode mais ser alterado.")) return;
    const b = e.currentTarget; b.disabled = true; b.textContent = "Publicando…";
    try {
      await api.publicarContrato(contratoId);
      toast("Contrato publicado");
      telaContrato();
    } catch (err) { toast(err.message); b.disabled = false; b.textContent = "Publicar"; }
  };
}

// Testemunha nao entra: o laudo e anexo do contrato, e desde a Lei 14.620/2023
// nem o contrato exige testemunhas quando ha conferencia de integridade.
const PARTES_ESPERADAS = {
  entrada:   ["proprietario", "inquilino", "vistoriador"],
  saida:     ["proprietario", "inquilino", "vistoriador"],
  periodica: ["proprietario", "vistoriador"],
  captacao:  ["proprietario", "corretor"],
};
const ROT_PAPEL = { proprietario: "Proprietário", inquilino: "Inquilino", fiador: "Fiador",
                    corretor: "Corretor", vistoriador: "Vistoriador", testemunha: "Testemunha" };
// Um signatário só. Fiador e testemunha podem ser vários.
const PAPEL_UNICO = ["proprietario", "inquilino", "vistoriador", "corretor"];

const ROT_STATUS = { trial: "Teste", ativa: "Ativa", vencida: "Vencida",
                     suspensa: "Suspensa", cancelada: "Cancelada" };

async function telaAdmin() {
  raiz.innerHTML = moldura(`<div class="view">
    <div class="view-head"><h2>Gestão de contas</h2><div class="meta">Carregando…</div></div>
    ${carregando()}</div>`);
  ligarMoldura();

  let contas = [], planos = [];
  try {
    await api.marcarVencidas();
    [contas, planos] = await Promise.all([api.adminContas(), api.adminPlanos()]);
  } catch (e) { toast(e.message); }

  const receita = contas
    .filter((c) => c.status === "ativa")
    .reduce((soma, c) => {
      const p = planos.find((x) => x.id === c.plano);
      return soma + Number(p?.preco_mensal || 0);
    }, 0);

  const vencendo = contas.filter((c) => c.dias_restantes != null && c.dias_restantes <= 7 && c.dias_restantes >= 0);
  const vencidas = contas.filter((c) => c.dias_restantes != null && c.dias_restantes < 0);

  const cardConta = (c) => {
    const cor = c.status === "ativa" ? (c.dias_restantes <= 7 ? "warn" : "ok")
              : c.status === "trial" ? "info" : "bad";
    const prazo = c.dias_restantes == null ? "sem assinatura"
      : c.dias_restantes < 0 ? `vencida há ${Math.abs(c.dias_restantes)} dias`
      : c.dias_restantes === 0 ? "vence hoje"
      : `${c.dias_restantes} dias restantes`;
    return `
    <div class="card-item" data-conta="${c.conta_id}">
      <div class="card-row abre-gestao" style="cursor:pointer">
        <div>
          <h3>${esc(c.nome)}</h3>
          <div class="meta">${esc(c.email_dono || "—")}</div>
          <div class="meta">${c.imoveis} imóveis · ${c.laudos} laudos · ${c.membros} membro(s)</div>
          <span class="chip ${cor}">${ROT_STATUS[c.status] || "—"} · ${prazo}</span>
        </div>
        <div style="text-align:right">
          <span class="chip neutro sem-margem">${esc(c.plano_nome || "—")}</span>
          <div class="meta" style="margin-top:6px">${c.tipo === "imobiliaria" ? "Equipe" : "Autônomo"}</div>
        </div>
      </div>

      <div class="gestao oculto" style="margin-top:12px;border-top:1px solid var(--sd-border);padding-top:12px">
        <div class="campo"><label>Plano</label>
          <select class="g_plano">
            ${planos.map((p) => `<option value="${p.id}" ${p.id === c.plano ? "selected" : ""}>
              ${esc(p.nome)} — ${brl(p.preco_mensal)}/mês</option>`).join("")}
          </select></div>

        <div class="campo"><label>Liberar por</label>
          <div class="filtros" style="padding:0">
            ${[1, 3, 6, 12].map((m) =>
              `<button class="fchip g_meses" data-m="${m}">${m} ${m === 1 ? "mês" : "meses"}</button>`).join("")}
          </div>
        </div>

        <div class="dupla">
          <div class="campo"><label>Valor recebido (R$)</label>
            <input class="g_valor" inputmode="decimal"></div>
          <div class="campo"><label>Forma</label>
            <select class="g_forma">
              <option value="pix">Pix</option>
              <option value="boleto">Boleto</option>
              <option value="cartao">Cartão</option>
              <option value="cortesia">Cortesia</option>
            </select></div>
        </div>
        <div class="campo"><label>Observação</label><input class="g_obs" placeholder="opcional"></div>

        <button class="btn btn-primary btn-bloco g_liberar" disabled>Escolha o período</button>
        <div class="acoes-linha" style="margin-top:10px">
          <button class="acao-min g_historico">📄 Histórico</button>
          <button class="acao-min g_suspender">⏸ Suspender</button>
        </div>
        <div class="g_saida"></div>
      </div>
    </div>`;
  };

  raiz.innerHTML = moldura(`<div class="view">
    <div class="view-head">
      <h2>Gestão de contas</h2>
      <div class="meta">${contas.length} contas · receita recorrente ${brl(receita)}/mês</div>
    </div>

    <div class="numeros">
      <div><div class="n" style="color:var(--sd-success)">${contas.filter((c) => c.status === "ativa").length}</div>
        <div class="l">Ativas</div></div>
      <div><div class="n" style="color:var(--sd-warning)">${vencendo.length}</div>
        <div class="l">Vencem em 7d</div></div>
      <div><div class="n" style="color:var(--sd-danger)">${vencidas.length}</div>
        <div class="l">Vencidas</div></div>
    </div>

    ${vencendo.length || vencidas.length ? `
      <div class="secao"><span>Precisa de atenção</span></div>
      ${[...vencidas, ...vencendo].map(cardConta).join("")}` : ""}

              </div>`).join("");
      } catch (err) { toast(err.message); }
    };
  });
}

/* =====================================================================
   TEXTO DO CONTRATO DE LOCAÇÃO
   Cláusulas conforme a Lei 8.245/91. O modelo é um ponto de partida:

   ===================================================================== */
const MESES_PT = ["janeiro","fevereiro","março","abril","maio","junho",
                  "julho","agosto","setembro","outubro","novembro","dezembro"];

function dataExtenso(iso) {
  if (!iso) return "—";
  const d = new Date(iso + "T12:00");
  return `${d.getDate()} de ${MESES_PT[d.getMonth()]} de ${d.getFullYear()}`;
}
const dataBR = (iso) => iso ? new Date(iso + "T12:00").toLocaleDateString("pt-BR") : "—";

const ROT_GARANTIA = {
  caucao: "caução em dinheiro", fiador: "fiança",
  seguro_fianca: "seguro-fiança", titulo_capitalizacao: "título de capitalização",

};

function textoContrato(c) {
  const im = c.imovel || {}, v = c.valores || {}, pz = c.prazo || {};

  const locatarios = (c.partes || []).filter((p) => p.papel === "inquilino");

  const qualifica = (p) =>
    `<b>${esc(p.nome)}</b>${p.cpf_cnpj ? `, inscrito(a) no CPF/CNPJ sob nº ${esc(p.cpf_cnpj)}` : ""}` +
    `${p.endereco ? `, residente em ${esc(p.endereco)}` : ""}`;

  const cl = [];

  cl.push([`Do objeto`,

     a fim ${esc(c.finalidade_uso || "residencial")}, sendo vedada a mudança de destinação sem

     Findo o prazo sem oposição do LOCADOR, a locação prorroga-se por prazo indeterminado,

  cl.push([`Do aluguel`,

      : v.garantia === "seguro_fianca"

      : v.garantia === "titulo_capitalizacao"

      : `As partes ajustam a locação sem exigência de garantia, na forma do art. 37 da Lei 8.245/91.`]);

  cl.push([`Das benfeitorias`,

  cl.push([`Da rescisão e da multa`,
    `A infração de qualquer cláusula sujeita a parte infratora ao pagamento de multa correspondente
