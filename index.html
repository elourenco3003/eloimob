     nos termos do art. 4º da Lei 8.245/91.`]);

  cl.push([`Da vistoria de saída`,
    `Ao término da locação será realizada vistoria de saída, comparada item a item com a de entrada.
     Os reparos de danos que excedam o desgaste natural correrão por conta do LOCATÁRIO, podendo ser
     abatidos da garantia prestada, mediante apresentação de orçamento.`]);

  cl.push([`Da forma eletrônica`,
    `As partes reconhecem a validade da assinatura eletrônica aposta neste instrumento, nos termos
     da Lei 14.063/2020 e do art. 784, §4º, do Código de Processo Civil, declarando íntegro e
     autêntico o documento identificado pelo código de autenticidade ao final.`]);

  if (c.clausulas_extras?.trim()) cl.push([`Disposições complementares`, esc(c.clausulas_extras)]);

  cl.push([`Do foro`,
    `Fica eleito o foro da comarca de ${esc(im.cidade || "situação do imóvel")} para dirimir
     as questões oriundas deste contrato, com renúncia a qualquer outro.`]);

  const romanos = ["PRIMEIRA","SEGUNDA","TERCEIRA","QUARTA","QUINTA","SEXTA","SÉTIMA","OITAVA",
                   "NONA","DÉCIMA","DÉCIMA PRIMEIRA","DÉCIMA SEGUNDA","DÉCIMA TERCEIRA","DÉCIMA QUARTA"];

  return `
    <div class="doc">
      <h2 class="doc-titulo">Contrato de Locação de Imóvel ${esc(c.finalidade_uso || "Residencial")}</h2>

      <p class="doc-p"><b>LOCADOR${locadores.length > 1 ? "ES" : ""}:</b>
        ${locadores.map(qualifica).join("; ") || "—"}.</p>
      <p class="doc-p"><b>LOCATÁRIO${locatarios.length > 1 ? "S" : ""}:</b>
        ${locatarios.map(qualifica).join("; ") || "—"}.</p>
      ${fiadores.length ? `<p class="doc-p"><b>FIADOR${fiadores.length > 1 ? "ES" : ""}:</b>
        ${fiadores.map(qualifica).join("; ")}.</p>` : ""}
      ${c.conta?.creci ? `<p class="doc-p"><b>ADMINISTRADORA:</b> ${esc(c.conta.nome)}
        ${c.conta.documento ? `, CNPJ ${esc(c.conta.documento)}` : ""}, CRECI ${esc(c.conta.creci)}.</p>` : ""}

      <p class="doc-p">As partes acima qualificadas têm entre si justo e contratado o presente
        contrato de locação, que se regerá pela Lei 8.245/91 e pelas cláusulas seguintes.</p>

      ${cl.map(([titulo, corpo], i) => `
        <div class="doc-clausula">

      <p class="doc-p">E por estarem justas e contratadas, as partes assinam eletronicamente
        o presente instrumento.</p>
      <p class="doc-p">${esc(im.cidade || "")}, ${dataExtenso(pz.inicio)}.</p>
    </div>`;
}

// O dataBR concatena "T12:00" para tratar colunas do tipo date sem
// escorregar de fuso. Em colunas timestamptz isso quebra, então
// carimbo de data e hora tem a sua própria função.
const dataHoraBR = (iso) => iso
  ? new Date(iso).toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" })
  : "—";

/* =====================================================================
   FICHAS — análise de crédito do candidato à locação
   ===================================================================== */
const ROT_FICHA = { rascunho:"Rascunho", aguardando_candidato:"Aguardando o candidato",
  autorizada:"Autorizada, pronta para consultar", consultando:"Consultando…",
  concluida:"Concluída", expirada:"Expirada", cancelada:"Cancelada" };
const CHIP_FICHA = { rascunho:"neutro", aguardando_candidato:"warn", autorizada:"info",
  consultando:"info", concluida:"ok", expirada:"neutro", cancelada:"bad" };

// O ROT_GARANTIA do contrato é minúsculo, para caber no meio da frase da
// cláusula. Aqui o rótulo aparece sozinho em tela, então precisa de caixa alta.
const GARANTIA_TITULO = { sem_garantia:"Sem garantia", caucao:"Caução",
  fiador:"Fiador", seguro_fianca:"Seguro-fiança", titulo_capitalizacao:"Título de capitalização" };

const CHIP_VEREDITO = { aprovar:"ok", reforco:"warn", recusar:"bad" };
const ROT_VEREDITO  = { aprovar:"Aprovado", reforco:"Aprovado com reforço", recusar:"Recusado" };

const soDigitos = (s) => String(s ?? "").replace(/\D/g, "");
const mascaraCpf = (s) => {
  const d = soDigitos(s);
  return d.length === 11
    ? d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, "$1.$2.$3-$4")
    : d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/, "$1.$2.$3/$4-$5");
};

// Validação de dígito verificador. Evita gastar consulta com CPF digitado errado.
function cpfValido(entrada) {
  const c = soDigitos(entrada);
  if (c.length !== 11 || /^(\d)\1{10}$/.test(c)) return false;
  for (const corte of [9, 10]) {
    let soma = 0;
    for (let i = 0; i < corte; i++) soma += +c[i] * (corte + 1 - i);
    const d = (soma * 10) % 11 % 10;
    if (d !== +c[corte]) return false;
  }
  return true;
}

function blocoParecer(p) {
  if (!p) return "";
  const travado = (p.travas || []).length > 0;
  const pontos = travado ? 0 : (p.pontos ?? 0);
  const corte = p.corte ?? 55;

  const razoes = [
    ...(p.travas || []).map((t) => `
      <div class="razao"><div class="pts trava">TRAVA</div>
        <div><div class="t">${esc(t.titulo)}</div><div class="d">${esc(t.texto)}</div></div></div>`),
    ...(p.razoes || []).map((r) => {
      const c = r.pontos > 0 ? "mais" : r.pontos < 0 ? "menos" : "zero";
      const s = r.pontos > 0 ? `+${r.pontos}` : String(r.pontos);
      return `<div class="razao"><div class="pts ${c}">${s}</div>
        <div><div class="t">${esc(r.titulo)}</div><div class="d">${esc(r.texto)}</div></div></div>`;
    }),
  ].join("");

  const expl = travado
    ? "Há impedimento absoluto. A pontuação não entra na conta: nenhuma garantia cobre esse tipo de risco."
    : `Pontuação ${pontos} contra corte de ${corte} para ${GARANTIA_TITULO[p.garantia]?.toLowerCase() || "a garantia"}.`;

  return `
    <div class="card-item veredito">
      <span class="chip ${CHIP_VEREDITO[p.veredito]} sem-margem">${ROT_VEREDITO[p.veredito]}</span>
      <h2>${esc(p.titulo)}</h2>
      <p class="expl">${expl}</p>
      <div class="trilho">
        <div class="trilho-barra">
          <i class="z-nao" style="width:48%"></i>
          <i class="z-meio" style="width:${Math.max(0, corte - 48)}%"></i>
          <i class="z-ok" style="width:${100 - corte}%"></i>
          <span class="marcador" style="left:calc(${pontos}% - 2px)"></span>
        </div>
        <div class="trilho-legenda"><span>Recusa</span><span>Reforço</span><span>Aprovação</span></div>
      </div>
    </div>
    <div class="secao"><span>Por que essa decisão</span></div>
    <div class="card-item" style="padding:0">${razoes}</div>`;
}

/* ---------------------------------------------------------------------
   O relatório completo: as mesmas seções da ficha da concorrência,
   só que abaixo do parecer, não no lugar dele. O corretor decide pelo
   veredito; estas seções existem para ele conferir e justificar.
   ------------------------------------------------------------------- */
// A Alude escreve "Baixo risco de inadimplência" embaixo do score. É a
// leitura que o corretor entende sem saber o que significa a letra.
const ROT_RISCO = { A:"Risco muito baixo de inadimplência", B:"Baixo risco de inadimplência",
  C:"Risco moderado de inadimplência", D:"Risco de atenção",
  E:"Risco alto de inadimplência", F:"Risco alto de inadimplência",
  G:"Risco muito alto de inadimplência", H:"Risco muito alto de inadimplência" };

const ROT_DECISAO = { aprovada:"Locação aprovada",
  aprovada_com_reforco:"Aprovada com garantia reforçada",
  nao_aprovada:"Locação não aprovada" };
const CHIP_DECISAO = { aprovada:"ok", aprovada_com_reforco:"warn", nao_aprovada:"bad" };

const ROT_CPF = { REGULAR:"Regular", PENDENTE:"Pendente de regularização",
  SUSPENSA:"Suspensa", CANCELADA:"Cancelada", "TITULAR FALECIDO":"Titular falecido",
  NULA:"Nula" };

const par = (k, v) => v == null || v === "" ? ""
  : `<div class="par"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>`;

const secao = (titulo, conta, corpo, aberta = false) => `
  <details class="rel-sec"${aberta ? " open" : ""}>
    <summary>${esc(titulo)}<span class="conta">${conta}</span></summary>
    <div class="rel-corpo">${corpo}</div>
  </details>`;

const vazio = (t) => `<div class="vazio-sec">${esc(t)}</div>`;

const periodo = (ini, fim) =>
  `${ini ? dataBR(ini) : "—"} até ${fim ? dataBR(fim) : "hoje"}`;

function relatorioCompleto(s) {
  if (!s) return "";
  const p = s.pessoais || {}, c = s.contatos || {}, rl = s.relacionamentos || {};
  const rt = s.restritivo || {}, fi = s.financeiro || {}, pr = s.profissional || {};
  const sv = s.servidor || {}, pc = s.processos || [];

  const blocos = [];

  blocos.push(secao("Dados pessoais", "", [
    par("Nome", p.nome), par("CPF", p.cpf ? mascaraCpf(p.cpf) : null),
    par("Situação na Receita", ROT_CPF[p.situacao_cpf] || p.situacao_cpf),
    par("Desde", p.data_situacao ? dataBR(p.data_situacao) : null),
    par("Nascimento", p.nascimento
      ? `${dataBR(p.nascimento)}${p.idade ? ` (${p.idade} anos)` : ""}` : null),
    par("Gênero", p.genero), par("Nacionalidade", p.nacionalidade), par("Mãe", p.mae),
    p.falecido ? `<div class="erro">Há indicação de óbito nas bases consultadas.</div>` : "",
  ].join("") || vazio("Sem dados."), true));

  const rest = [
    par("Score", rt.score != null
      ? `${rt.score}${rt.nivel ? " " + rt.nivel : ""}` : null),
    par("Leitura", rt.nivel ? ROT_RISCO[rt.nivel] : null),
    par("Débitos em aberto", brl(rt.total_debitos || 0)),
    par("Protestos", brl(rt.total_protestos || 0)),
    par("Cheques devolvidos", String(rt.cheques_devolvidos ?? 0)),
    (rt.debitos || []).map((d) => `<div class="item-lista">
        <div class="tit">${esc(d.credor)} — ${brl(d.valor)}</div>
        <div class="sub">${[d.data && dataBR(d.data), d.origem].filter(Boolean).map(esc).join(" · ")}</div>
      </div>`).join(""),
    (rt.protestos || []).map((x) => `<div class="item-lista">
        <div class="tit">${esc(x.cartorio)} — ${brl(x.valor)}</div>
        <div class="sub">${[[x.cidade, x.uf].filter(Boolean).join("/"), x.data && dataBR(x.data)]
          .filter(Boolean).map(esc).join(" · ")}</div>
      </div>`).join(""),
    rt.consultado_biro ? "" :
      `<div class="aviso-linha warn">Dados restritivos não retornados nesta consulta</div>`,
  ].join("");
  blocos.push(secao("Restrição financeira", "SPC · Serasa · protestos", rest, true));

  blocos.push(secao("Informações financeiras", `${(fi.irpf || []).length} IRPF`, [
    par("Renda mensal estimada", fi.faixa_renda === "SEM INFORMACAO" ? "Sem informação" : fi.faixa_renda),
    par("Patrimônio estimado", fi.patrimonio),
    (fi.irpf || []).length
      ? (fi.irpf || []).map((d) => `<div class="item-lista">
          <div class="tit">Exercício ${esc(String(d.ano ?? "—"))}${d.situacao ? " · " + esc(d.situacao) : ""}</div>
          <div class="sub">${[d.banco, d.agencia && "agência " + d.agencia]
            .filter(Boolean).map(esc).join(" · ") || "Sem dados bancários"}</div>
        </div>`).join("")
      : vazio("Nenhuma declaração encontrada."),
  ].join("")));

  blocos.push(secao("Histórico profissional", `${(pr.historico || []).length}`,
    (pr.historico || []).length
      ? (pr.historico || []).map((v) => `<div class="item-lista">
          <div class="tit">${esc(v.empresa)}${v.fim ? "" : " · atual"}</div>
          <div class="sub">${[v.classificacao, v.setor, periodo(v.inicio, v.fim)]
            .filter(Boolean).map(esc).join(" · ")}</div>
        </div>`).join("")
      : vazio("Nenhum vínculo encontrado.")));

  blocos.push(secao("Antecedentes judiciais", `${pc.length}`,
    pc.length
      ? pc.map((x) => `<div class="item-lista">
          <div class="tit">${esc(x.classe)}${x.assunto ? " — " + esc(x.assunto) : ""}</div>
          <div class="sub">${[x.tribunal, x.numero, x.data && dataBR(x.data),
            x.valor && brl(x.valor)].filter(Boolean).map(esc).join(" · ")}</div>
          ${(x.partes || []).length ? `<div class="sub">Partes: ${
            x.partes.map((q) => esc(q.nome) + (q.papel ? ` (${esc(q.papel)})` : "")).join(", ")}</div>` : ""}
          <div class="sub"><span class="chip ${x.polo === "requerente" ? "ok" : "warn"} sem-margem">${
            x.polo === "requerente" ? "Autor" : "Réu"}</span>
            <span class="chip ${x.situacao === "andamento" ? "warn" : "neutro"} sem-margem">${
            x.situacao === "andamento" ? "Em andamento" : "Arquivado"}</span></div>
        </div>`).join("")
      : vazio("Nenhum processo encontrado.")));

  blocos.push(secao("Relacionamentos",
    `${(rl.familiares || []).length + (rl.economicos || []).length}`,
    [
      (rl.economicos || []).map((e) => `<div class="item-lista">
        <div class="tit">${esc(e.empresa)}</div>
        <div class="sub">${[e.vinculo, e.cnpj, e.desde && "desde " + dataBR(e.desde)]
          .filter(Boolean).map(esc).join(" · ")}</div></div>`).join(""),
      (rl.familiares || []).map((f) => `<div class="item-lista">
        <div class="tit">${esc(f.nome)}</div>
        <div class="sub">${esc(f.parentesco || "Vínculo familiar")}</div></div>`).join(""),
    ].join("") || vazio("Nenhum relacionamento encontrado.")));

  blocos.push(secao("Servidor público", sv.ativo ? "sim" : "não",
    par("Registros encontrados", String((sv.registros || []).length)) +
    par("Atualmente em exercício", sv.ativo ? "Sim" : "Não") +
    ((sv.registros || []).length
      ? (sv.registros || []).map((x) => `<div class="item-lista">
          <div class="tit">${esc(x.orgao)}</div>
          <div class="sub">${[x.cargo, x.esfera, x.situacao].filter(Boolean).map(esc).join(" · ")}</div>
        </div>`).join("")
      : vazio("Nenhum registro em bases de servidores públicos."))));

  blocos.push(secao("Contatos e endereços",
    `${(c.telefones || []).length + (c.enderecos || []).length}`,
    [
      (c.telefones || []).map((t) => `<div class="item-lista">
        <div class="tit">${esc(t.numero)}</div>
        <div class="sub">${[t.tipo, t.operadora, t.registro,
          t.atualizado && "visto em " + dataBR(t.atualizado)]
          .filter(Boolean).map(esc).join(" · ")}</div></div>`).join(""),
      (c.emails || []).map((e) => `<div class="item-lista">
        <div class="tit">${esc(e.email)}</div></div>`).join(""),
      (c.enderecos || []).map((a) => `<div class="item-lista">
        <div class="tit">${esc(a.logradouro)}${a.complemento ? ", " + esc(a.complemento) : ""}</div>
        <div class="sub">${[a.bairro, [a.cidade, a.uf].filter(Boolean).join("/"), a.cep]
          .filter(Boolean).map(esc).join(" · ")}</div></div>`).join(""),
    ].join("") || vazio("Nenhum contato encontrado.")));

  return `<div class="secao"><span>Relatório completo</span></div>${blocos.join("")}
    <div class="card-item"><div class="meta" style="line-height:1.5">
      Dados obtidos em bases públicas e de birô de crédito, com autorização
      expressa do titular. Podem conter divergências ou desatualização em
      relação à fonte original.</div></div>`;
}

/* O rodapé é o que dá peso ao documento: carimbo, selo de integridade e,
   principalmente, o registro do consentimento. A ficha da concorrência
   não traz isso — e é justamente o que a LGPD cobra. */
function rodapeFicha(f) {
  const base = location.origin + location.pathname.replace(/[^/]*$/, "");
  return `<div class="pag-rodape">
    Análise emitida eletronicamente pelo Elo IMOB em ${dataHoraBR(f.publicada_em || f.consulta_em)}.<br>
    Código de integridade (SHA-256): ${esc(f.sha256 || "—")}<br>
    Consulta autorizada pelo titular em ${dataHoraBR(f.autorizada_em)}${
      f.autorizacao_ip ? `, a partir do IP ${esc(f.autorizacao_ip)}` : ""}, mediante
    assinatura eletrônica, nos termos do art. 7º, V, da Lei 13.709/2018.<br>
    Dados obtidos em bases públicas e de birô de crédito. Documento de uso restrito
    à análise desta locação.<br>
    Conferência: ${esc(base)}#parecer=${esc(f.token_publico)}
  </div>
  ${f.autorizacao_rubrica ? `<div class="card-item" style="text-align:center">
    <div class="meta" style="margin-bottom:8px">Autorização assinada por ${esc(f.nome)}</div>
    <img class="rubrica-final" style="margin:0 auto" src="${esc(f.autorizacao_rubrica)}"
      alt="Assinatura de ${esc(f.nome)}">
  </div>` : ""}`;
}

/* A trilha das camadas. Mostrar isso não é vaidade técnica: é o que
   explica ao corretor por que uma ficha custou centavos e outra custou
   o valor cheio. */
function trilhaCamadas(f) {
  const t = f.consulta_bruta?._camadas;
  if (!Array.isArray(t) || !t.length) return "";

  const linhas = t.map((c) => `
    <div class="razao">
      <div class="pts ${c.parou ? "menos" : "zero"}">${
        c.custo ? "R$ " + Number(c.custo).toFixed(2).replace(".", ",") : "—"}</div>
      <div>
        <div class="t">${c.camada}. ${esc(c.nome)}</div>
        <div class="d">${c.parou
          ? "Parou aqui: " + esc(c.motivo) + ". As camadas seguintes não foram consultadas."
          : esc(c.datasets.length) + " base(s) consultada(s)."}</div>
      </div>
    </div>`).join("");

  const total = t.reduce((s, c) => s + (Number(c.custo) || 0), 0);
  const parou = t.find((c) => c.parou);

  return `
    <div class="secao"><span>Como a consulta foi feita</span></div>
    <div class="card-item" style="padding:0">${linhas}
      <div class="razao">
        <div class="pts">${total ? "R$ " + total.toFixed(2).replace(".", ",") : "—"}</div>
        <div><div class="t">Custo total</div>
          <div class="d">${parou
            ? "A análise parou na camada " + parou.camada + " e economizou as consultas seguintes."
            : "Todas as camadas foram consultadas."}</div></div>
      </div>
    </div>`;
}

/* Divergência de identidade merece destaque próprio: é o único achado
   que pode significar fraude, e o corretor precisa vê-lo antes de tudo. */
function alertaIdentidade(f) {
  const p = f.consulta_bruta?.secoes?.pessoais;
  if (!p || p.confere !== false) return "";
  return `<div class="card-item" style="border-color:var(--sd-danger)">
    <div class="rotulo" style="color:var(--sd-danger)">Conferir identidade</div>
    <div class="linha-item"><span class="meta">Nome cadastrado</span>
      <div><b>${esc(p.nome_informado || f.nome)}</b></div></div>
    <div class="linha-item"><span class="meta">Nome na Receita Federal</span>
      <div><b>${esc(p.nome || "—")}</b></div></div>
    <div class="meta" style="margin-top:10px;line-height:1.5">
      Os nomes não batem. Pode ser erro de digitação ou documento de outra pessoa.
      Confira o documento do candidato. Se o cadastro estiver errado, corrija o nome
      e refaça a consulta.</div>
  </div>`;
}

/* A decisão da imobiliária. O parecer é do sistema; a decisão é de quem
   assina. Deixar os dois separados protege a imobiliária: fica registrado
   quem decidiu, quando, e por que discordou se for o caso. */
function blocoDecisao(f) {
  if (!f.parecer) return "";

  if (f.decisao) {
    return `
      <div class="secao"><span>Decisão da imobiliária</span></div>
      <div class="card-item">
        <span class="chip ${CHIP_DECISAO[f.decisao]}">${ROT_DECISAO[f.decisao]}</span>
        ${f.decisao_divergente ? `<div class="aviso-linha warn">Decisão diferente do parecer do sistema</div>` : ""}
        ${f.decisao_observacao ? `<p class="doc-p">${esc(f.decisao_observacao)}</p>` : ""}
        <div class="linha-item"><span class="meta">Assinada por</span>
          <div><b>${esc(f.decisao_assinante)}</b></div></div>
        <div class="linha-item"><span class="meta">Em</span>
          <div><b>${dataHoraBR(f.decidida_em)}</b></div></div>
        ${f.decisao_rubrica ? `<img class="rubrica-final" style="margin:12px auto 0"
          src="${esc(f.decisao_rubrica)}" alt="Assinatura de ${esc(f.decisao_assinante)}">` : ""}
      </div>`;
  }

  const sugerida = { aprovar:"aprovada", reforco:"aprovada_com_reforco",
                     recusar:"nao_aprovada" }[f.parecer.veredito];

  return `
    <div class="secao"><span>Decisão da imobiliária</span></div>
    <div class="card-item nao-imprime">
      <div class="meta" style="margin-bottom:12px;line-height:1.5">
        O parecer acima é do sistema. A decisão é sua, e fica registrada com
        sua assinatura. Se decidir diferente do parecer, explique o motivo.</div>

      <div class="campo"><label>Decisão</label>
        <select id="dc_decisao">
          ${Object.entries(ROT_DECISAO).map(([k, n]) =>
            `<option value="${k}" ${k === sugerida ? "selected" : ""}>${n}</option>`).join("")}
        </select></div>

      <div class="campo"><label>Quem está assinando</label>
        <input id="dc_assinante" autocomplete="name"
          placeholder="Nome do responsável"></div>

      <div class="campo"><label>Observações</label>
        <input id="dc_obs" placeholder="obrigatório se discordar do parecer"></div>

      <div class="rubrica-caixa">
        <label>Assinatura</label>
        <div class="rubrica-area" id="areaDecisao">
          <canvas></canvas>
          <div class="rubrica-linha"></div>
          <div class="rubrica-placeholder">Assine acima da linha</div>
        </div>
        <div class="rubrica-acoes">
          <span class="meta">Dedo, caneta ou mouse</span>
          <button class="acao-min" id="limparDecisao">Apagar e refazer</button>
        </div>
      </div>

      <div id="erroDecisao"></div>
      <button class="btn btn-primary btn-bloco" id="assinarDecisao"
        style="margin-top:12px">Registrar decisão</button>
    </div>`;
}

async function telaFichas() {
  raiz.innerHTML = moldura(`<div class="view">
    <div class="view-head"><h2>Fichas</h2><div class="meta">Carregando…</div></div>${carregando()}</div>`);
  ligarMoldura();

  let lista = [];
  try { lista = await api.listarFichas(); } catch (e) { toast(e.message); }

  const cards = lista.length === 0
    ? `<div class="card-item">
        <div class="empty"><b>Nenhuma ficha</b>Analise o crédito de um candidato antes de fechar a locação.</div>
        <button class="btn btn-primary btn-bloco" onclick="eloAbrir('novaFicha')">Nova ficha</button></div>`
    : lista.map((f) => `
      <button class="card-btn" onclick="eloAbrir('ficha',{fichaId:'${f.id}'})">
        <div class="card-row">
          <div>
            <h3>${esc(f.nome)}</h3>
            <div class="meta">${esc(mascaraCpf(f.cpf_cnpj))}${
              f.aluguel_pretendido ? " · " + brl(f.aluguel_pretendido) : ""}</div>
            ${f.parecer ? `<div class="meta">Parecer: ${ROT_VEREDITO[f.parecer.veredito]}${
              f.parecer.pontos != null ? " · " + f.parecer.pontos + " pontos" : ""}</div>` : ""}
          </div>
          <span class="chip ${f.parecer ? CHIP_VEREDITO[f.parecer.veredito] : CHIP_FICHA[f.status]} sem-margem">${
            f.parecer ? ROT_VEREDITO[f.parecer.veredito] : ROT_FICHA[f.status]}</span>
        </div>
      </button>`).join("");

  raiz.innerHTML = moldura(`<div class="view">
    <div class="view-head"><h2>Fichas</h2>
      <div class="meta">${lista.length} ficha(s) · ${
        lista.filter((f) => f.status === "concluida").length} concluída(s)</div></div>
    <div class="secao"><span>Todas</span>
      <button class="btn-add" onclick="eloAbrir('novaFicha')">+ Nova</button></div>
    ${cards}</div>`);
  ligarMoldura();
}

async function telaNovaFicha() {
  let imoveis = [];
  try { imoveis = await api.buscarImoveis({}); } catch (e) { /* imóvel é opcional */ }

  raiz.innerHTML = moldura(`<div class="view formulario">
    <button class="volta" onclick="eloVoltar()">← Fichas</button>
    <div class="view-head"><h2>Nova ficha</h2>
      <div class="meta">O candidato recebe um link, confirma o documento e assina a
        autorização. Só depois disso a consulta acontece.</div></div>

    <div class="card-item">
      <div class="campo"><label>Nome do candidato</label>
        <input id="fi_nome" autocomplete="off"></div>
      <div class="campo"><label>CPF</label>
        <input id="fi_cpf" inputmode="numeric" placeholder="000.000.000-00"></div>
      <div class="dupla">
        <div class="campo"><label>WhatsApp</label><input id="fi_tel" inputmode="tel"></div>
        <div class="campo"><label>Aluguel + encargos (R$)</label>
          <input id="fi_aluguel" inputmode="decimal"></div>
      </div>
      <div class="campo"><label>Garantia oferecida</label>
        <select id="fi_garantia">
          <option value="sem_garantia">Sem garantia</option>
          <option value="caucao">Caução</option>
          <option value="fiador" selected>Fiador</option>
          <option value="seguro_fianca">Seguro-fiança</option>
          <option value="titulo_capitalizacao">Título de capitalização</option>
        </select></div>
      ${imoveis.length ? `<div class="campo"><label>Imóvel (opcional)</label>
        <select id="fi_imovel"><option value="">Nenhum</option>
          ${imoveis.map((i) => `<option value="${i.id}" data-aluguel="${i.valor_aluguel || ""}">
            ${esc(i.codigo || "—")} — ${esc(i.bairro || i.cidade || "")}</option>`).join("")}
        </select></div>` : ""}
    </div>
    <div id="erroFicha"></div>
  </div>`, `<button class="btn btn-primary btn-bloco" id="salvarFicha">Criar e gerar link</button>`);
  ligarMoldura();

  // Escolher o imóvel já preenche o aluguel: menos digitação em campo.
  document.getElementById("fi_imovel")?.addEventListener("change", (e) => {
    const v = e.target.selectedOptions[0]?.dataset.aluguel;
    if (v) document.getElementById("fi_aluguel").value = v;
  });

  document.getElementById("fi_cpf").addEventListener("blur", (e) => {
    if (soDigitos(e.target.value).length === 11) e.target.value = mascaraCpf(e.target.value);
  });

  document.getElementById("salvarFicha").addEventListener("click", async (ev) => {
    const b = ev.currentTarget;
    const v = (id) => document.getElementById(id)?.value.trim() ?? "";
    const box = document.getElementById("erroFicha");
    box.innerHTML = "";

    if (v("fi_nome").length < 3) { box.innerHTML = `<div class="erro">Informe o nome do candidato.</div>`; return; }
    if (!cpfValido(v("fi_cpf"))) { box.innerHTML = `<div class="erro">CPF inválido. Confira os números.</div>`; return; }
    const aluguel = parseFloat(v("fi_aluguel").replace(/\./g, "").replace(",", "."));
    if (!(aluguel > 0)) { box.innerHTML = `<div class="erro">Informe o valor do aluguel.</div>`; return; }

    b.disabled = true; b.textContent = "Criando…";
    try {
      const r = await api.criarFicha({
        nome: v("fi_nome"), cpf: v("fi_cpf"), aluguel,
        garantia: v("fi_garantia"), telefone: v("fi_tel"),
        imovel: document.getElementById("fi_imovel")?.value || null,
      });
      abrir("ficha", { fichaId: r.out_id });
    } catch (e) {
      box.innerHTML = `<div class="erro">${esc(e.message)}</div>`;
      b.disabled = false; b.textContent = "Criar e gerar link";
    }
  });
}

/* =====================================================================
   RUBRICA — desenho com dedo, caneta ou mouse
   Usa Pointer Events: um código só para os três.
   ===================================================================== */
function montarRubrica(area) {
  const canvas = area.querySelector("canvas");
  const ctx = canvas.getContext("2d");
  let desenhando = false, temTraco = false, ultimo = null;

  function dimensionar() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const r = canvas.getBoundingClientRect();
    const imagem = temTraco ? canvas.toDataURL() : null;
    canvas.width = Math.round(r.width * dpr);
    canvas.height = Math.round(r.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineWidth = 2.6;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.strokeStyle = "#15151C";
    if (imagem) {                       // preserva o traço ao girar o aparelho
      const img = new Image();
      img.onload = () => ctx.drawImage(img, 0, 0, r.width, r.height);
      img.src = imagem;
    }
  }

  const ponto = (e) => {
    const r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  };

  canvas.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    canvas.setPointerCapture(e.pointerId);
    desenhando = true;
    ultimo = ponto(e);
    // Um toque simples também marca: assinatura de quem faz um pingo.
    ctx.beginPath(); ctx.arc(ultimo.x, ultimo.y, 1.4, 0, Math.PI * 2); ctx.fill();
    temTraco = true; area.classList.add("temTraco");
  });

  canvas.addEventListener("pointermove", (e) => {
    if (!desenhando) return;
    e.preventDefault();
    const p = ponto(e);
    // Caneta com pressão desenha mais grosso; dedo mantém espessura fixa.
    ctx.lineWidth = e.pressure && e.pressure !== 0.5 ? 1.6 + e.pressure * 2.6 : 2.6;
    ctx.beginPath();
    ctx.moveTo(ultimo.x, ultimo.y);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    ultimo = p;
  });

  const soltar = (e) => { if (desenhando) { desenhando = false; ultimo = null; } };
  canvas.addEventListener("pointerup", soltar);
  canvas.addEventListener("pointercancel", soltar);
  canvas.addEventListener("pointerleave", soltar);

  window.addEventListener("resize", dimensionar);
  window.addEventListener("orientationchange", () => setTimeout(dimensionar, 260));
  requestAnimationFrame(dimensionar);

  return {
    limpar() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      temTraco = false;
      area.classList.remove("temTraco");
    },
    temTraco: () => temTraco,
    // Recorta o espaço vazio e reduz: a rubrica sai leve e centralizada.
    exportar() {
      if (!temTraco) return null;
      const dados = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
      let x0 = canvas.width, y0 = canvas.height, x1 = 0, y1 = 0;
      for (let y = 0; y < canvas.height; y++) {
        for (let x = 0; x < canvas.width; x++) {
          if (dados[(y * canvas.width + x) * 4 + 3] > 12) {
            if (x < x0) x0 = x; if (x > x1) x1 = x;
            if (y < y0) y0 = y; if (y > y1) y1 = y;
          }
        }
      }
      if (x1 <= x0 || y1 <= y0) return null;
      const m = 10;
      x0 = Math.max(0, x0 - m); y0 = Math.max(0, y0 - m);
      x1 = Math.min(canvas.width, x1 + m); y1 = Math.min(canvas.height, y1 + m);

      const larg = x1 - x0, alt = y1 - y0;
      const escala = Math.min(1, 600 / larg);
      const saida = document.createElement("canvas");
      saida.width = Math.round(larg * escala);
      saida.height = Math.round(alt * escala);
      saida.getContext("2d").drawImage(canvas, x0, y0, larg, alt, 0, 0, saida.width, saida.height);
      return saida.toDataURL("image/png");
    },
  };
}

        </div>`}

      ${ehContrato ? `
        ${textoContrato(c)}
        ${(d.outras_partes || []).length > 1 ? `
          <div class="secao"><span>Demais partes</span></div>
          <div class="card-item">
            ${d.outras_partes.map((o) => `
              <div class="card-row" style="padding:8px 0">
                <div><div style="font-weight:600">${esc(o.nome || "—")}</div>
                  <div class="meta">${ROT_PAPEL[o.papel] || esc(o.papel)}</div></div>
                <span class="chip ${o.status === "assinada" ? "ok" : "warn"} sem-margem">

      await api.registrarAssinatura(token, nome,
        document.getElementById("a_cpf").value, rubrica.exportar());
      toast("Assinatura registrada");
      paginaAssinatura(token);

  };

  document.getElementById("btnRecusar").onclick = async () => {
    const motivo = prompt("Descreva com o que você não concorda:");
    if (!motivo?.trim()) return;
    try {
      await api.recusarAssinatura(token, motivo.trim());
      toast("Recusa registrada");
      paginaAssinatura(token);
    } catch (err) { toast(err.message); }
  };

/* =====================================================================
   LIGAÇÕES DA MOLDURA
   ===================================================================== */
function ligarMoldura() {
  document.getElementById("abreGaveta")?.addEventListener("click", () => { app.gaveta = true; render(); });
  document.getElementById("fechaGaveta")?.addEventListener("click", () => { app.gaveta = false; render(); });
  document.getElementById("sair")?.addEventListener("click", () => sb.auth.signOut());
  document.getElementById("trocaTema")?.addEventListener("click", () => {
    const atual = document.documentElement.dataset.tema;
    document.documentElement.dataset.tema = atual === "claro" ? "escuro" : "claro";
    render();
  });
}

function ligarAuth() {
  raiz.querySelectorAll("[data-tipo]").forEach((b) =>
    b.addEventListener("click", () => { app.tipoEscolhido = b.dataset.tipo; render(); }));

  document.getElementById("trocaModo")?.addEventListener("click", () => {
    app.modoAuth = app.modoAuth === "entrar" ? "cadastrar" : "entrar";
    app.tipoEscolhido = null; render();
  });

  document.getElementById("btnAuth")?.addEventListener("click", async (ev) => {
    const b = ev.currentTarget; b.disabled = true; b.textContent = "Aguarde…";
    const v = (id) => document.getElementById(id)?.value ?? "";
    const box = document.getElementById("erroAuth");
    box.innerHTML = "";
    try {
      if (app.modoAuth === "entrar") {
        const { error } = await sb.auth.signInWithPassword({ email: v("f_email"), password: v("f_senha") });
        if (error) throw new Error(traduzErro(error.message));
      } else {
        const nome = v("f_nome") || v("f_email").split("@")[0];
        const { error } = await sb.auth.signUp({
          email: v("f_email"), password: v("f_senha"),
          options: { data: {
            nome,
            tipo_conta: app.tipoEscolhido,
            nome_conta: app.tipoEscolhido === "imobiliaria" ? (v("f_nomeConta") || nome) : nome,
            telefone: v("f_telefone") || null,
            creci: v("f_creci") || null,
          } },
        });
        if (error) throw new Error(traduzErro(error.message));
      }
    } catch (e) {
      box.innerHTML = `<div class="erro">${esc(e.message)}</div>`;
      b.disabled = false;
      b.textContent = app.modoAuth === "entrar" ? "Entrar" : "Criar conta";
    }
  });
}

/* =====================================================================
   7. RENDER
   ===================================================================== */
async function render() {
  // Páginas públicas têm prioridade: quem chega pelo link não faz login.
  const rota = new URLSearchParams(location.hash.replace(/^#/, ""));
  const tokenAssinatura = rota.get("assinar");
  const tokenVerificacao = rota.get("verificar");
  const tokenLaudo = rota.get("laudo");
  const tokenContrato = rota.get("contrato");
  const tokenFicha = rota.get("ficha");
  const tokenParecer = rota.get("parecer");
  if (tokenAssinatura) return paginaAssinatura(tokenAssinatura);
  if (tokenVerificacao) return paginaVerificacao(tokenVerificacao);
  if (tokenLaudo) return paginaLeituraLaudo(tokenLaudo);
  if (tokenContrato) return paginaLeituraContrato(tokenContrato);
  if (tokenFicha) return paginaFicha(tokenFicha);
  if (tokenParecer) return paginaParecer(tokenParecer);

  if (!app.sessao) { raiz.innerHTML = `<div class="app"><div class="auth-wrap">${telaAuth()}</div></div>`; ligarAuth(); return; }
  if (!app.conta) { raiz.innerHTML = carregando("Preparando sua conta…"); return; }

  if (app.tela === "contrato") return telaContrato();
  if (app.tela === "novoContrato") return telaNovoContrato();
  if (app.tela === "vistoria") return telaVistoria();
  if (app.tela === "laudo") return telaLaudo();
  if (app.tela === "novoImovel") return telaNovoImovel();
  if (app.tela === "ficha") return telaFicha();
  if (app.tela === "novaFicha") return telaNovaFicha();
  if (app.aba === "imoveis") return telaImoveis();
  if (app.aba === "laudos") return telaLaudos();
  if (app.aba === "contratos") return telaContratos();
  if (app.aba === "fichas") return telaFichas();
  if (app.aba === "admin" && app.admin) return telaAdmin();
  return telaInicio();
}

/* =====================================================================
   8. INÍCIO
   ===================================================================== */
const rotaPublica = /(?:^|#|&)(assinar|verificar|laudo|contrato|ficha|parecer)=/.test(location.hash);

if (rotaPublica) {
  render();                                  // link público: nem consulta sessão
} else {
  sb.auth.onAuthStateChange(async (_evento, sessao) => {
    app.sessao = sessao;
    app.conta = null;
    render();
    if (sessao) {
      // O trigger no banco pode levar um instante para criar a conta.
      for (let i = 0; i < 5 && !app.conta; i++) {
        try { app.conta = await api.minhaConta(); } catch (e) { /* tenta de novo */ }
        if (!app.conta) await new Promise((r) => setTimeout(r, 600));
      }
      if (!app.conta) toast("Conta não encontrada. Recarregue a página.");
      if (app.conta) {
        app.admin = await api.souAdmin();
        try { app.vigencia = await api.minhaVigencia(); } catch { app.vigencia = null; }
      }
      render();
    }
  });

  const { data: { session } } = await sb.auth.getSession();
  app.sessao = session;
  if (session) {
    try { app.conta = await api.minhaConta(); } catch (e) { toast(e.message); }
    if (app.conta) {
      app.admin = await api.souAdmin();
      try { app.vigencia = await api.minhaVigencia(); } catch { app.vigencia = null; }
    }
  }
  render();
}
</script>
</body>
</html>
